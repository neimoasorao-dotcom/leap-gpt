<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>LEAP 英単語学習</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f4f7f4;
  --card: #ffffff;
  --primary: #2d7a4f;
  --primary-light: #e8f5ee;
  --primary-dark: #1f5c3a;
  --accent: #4a90d9;
  --red: #e05252;
  --green: #3cb371;
  --yellow: #f5a623;
  --text: #1a2e22;
  --muted: #5a7464;
  --border: #d6e8dc;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  /* 下部固定ナビの高さ。JSで実測して上書きする（safe-area分は含まない）。 */
  --nav-h: 60px;
  /* 上部バー(sticky)の高さ。JSで実測して上書きする。 */
  --top-h: 0px;
}
html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
button { font: inherit; cursor: pointer; border: none; border-radius: var(--radius); transition: all 0.15s; }
button:active { transform: scale(0.97); }
input { font: inherit; border-radius: var(--radius); border: 1.5px solid var(--border); padding: 10px 14px; outline: none; width: 100%; }
input:focus { border-color: var(--primary); }

/* ── Layout ── */
#app { display: flex; flex-direction: column; min-height: 100%; }

/* ── Nav ── */
#nav {
  display: flex; gap: 4px; overflow-x: auto; padding: 10px 16px;
  background: #fff; border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
#nav::-webkit-scrollbar { display: none; }
.nav-btn {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px; font-weight: 600;
  background: var(--primary-light);
  color: var(--primary-dark);
  border: 1.5px solid transparent;
}
.nav-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary-dark);
}

/* ── Main Content ── */
#content { flex: 1; padding: 16px; max-width: 900px; margin: 0 auto; width: 100%; }

/* ── Range Picker ── */
.range-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: #fff; border-radius: var(--radius); padding: 12px 14px;
  border: 1px solid var(--border); margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.range-bar label { font-size: 13px; font-weight: 600; color: var(--muted); }
.range-bar input[type=number] { width: 72px; padding: 7px 10px; font-size: 13px; }
/* デスクトップでは常に展開表示。折りたたみ用のサマリーはモバイルでのみ使う */
.range-summary { display: none; }
/* 他ページの範囲を引き継ぐボタン（閉じた状態でも見える） */
.range-carry { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.range-carry-btn { background: #fff; color: var(--primary-dark); border: 1.5px solid var(--primary); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; min-height: 36px; }
.range-carry-btn b { font-weight: 800; }
.range-body { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: 100%; }

/* ── Word List (Study mode) ── */
.study-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 14px;
}
@media (max-width: 640px) {
  .study-layout { grid-template-columns: 1fr; }
  .study-list-panel { max-height: 220px; }
}
.study-list-panel {
  background: #fff; border-radius: var(--radius);
  border: 1px solid var(--border); overflow-y: auto;
  max-height: 65vh; max-height: 65dvh; box-shadow: var(--shadow);
}
.word-list-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid #f0f5f2;
  cursor: pointer; transition: background 0.1s;
  font-size: 14px;
}
.word-list-item:hover { background: var(--primary-light); }
.word-list-item.selected { background: var(--primary-light); border-left: 3px solid var(--primary); }
.word-list-item .num { font-size: 11px; color: var(--muted); min-width: 28px; }
.word-list-item .w { font-weight: 700; }
.word-list-item .m { font-size: 12px; color: var(--muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.word-list-item .wrong-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); flex-shrink: 0; }

.study-detail {
  background: #fff; border-radius: var(--radius);
  border: 1px solid var(--border); padding: 24px;
  box-shadow: var(--shadow);
  /* ボタン行を常にパネル下端に置き、単語ごとの内容の長さで位置がぶれないようにする */
  display: flex; flex-direction: column; min-height: 640px;
}
.study-detail .word-en { font-size: 36px; font-weight: 900; color: var(--primary-dark); margin-bottom: 8px; }
.study-detail .word-num { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.study-detail .meanings-list { margin-bottom: 20px; padding-left: 1.2em; }
.study-detail .meanings-list li { padding: 6px 0; font-size: 16px; border-bottom: 1px solid #f0f5f2; }
.study-detail .example { background: var(--primary-light); border-left: 3px solid var(--primary); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.6; color: var(--text); margin-top: 8px; }
.study-detail .example .ex-en { font-weight: 600; margin-bottom: 4px; }
.study-detail .example .ex-jp { color: var(--muted); font-size: 13px; }
.study-nav-row { display: flex; gap: 10px; margin-top: auto; padding-top: 20px; }
/* 発音記号 + 🔊 */
.pron-row { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
.ipa { font-family: "Segoe UI", "Noto Sans", "DejaVu Sans", "Lucida Sans Unicode", "Arial Unicode MS", sans-serif; font-size: 18px; color: var(--muted); letter-spacing: 0.02em; }
.speak-btn { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--primary-light); font-size: 18px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.result-box .pron-row { justify-content: center; margin-bottom: 6px; }
.result-box .ipa { font-size: 16px; }


/* ── Quiz / Test / Typing ── */
.quiz-card {
  background: #fff; border-radius: var(--radius);
  border: 1px solid var(--border); padding: 24px;
  box-shadow: var(--shadow); max-width: 600px; margin: 0 auto;
}
.quiz-progress { font-size: 13px; color: var(--muted); margin-bottom: 16px; text-align: center; }
.quiz-progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 20px; }
.quiz-progress-bar-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.3s; }
.quiz-question { font-size: 22px; font-weight: 800; text-align: center; margin-bottom: 28px; color: var(--text); line-height: 1.4; }
.quiz-type-label { text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.05em; text-transform: uppercase; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice-btn {
  padding: 14px 18px; font-size: 15px; font-weight: 600;
  background: var(--primary-light); color: var(--text);
  border-radius: var(--radius); text-align: left;
  border: 1.5px solid var(--border);
}
.choice-btn:hover:not(:disabled) { background: #d4eedd; border-color: var(--primary); }
.choice-btn.correct { background: #e6f9ee; border-color: var(--green); color: var(--green); }
.choice-btn.wrong { background: #fdecea; border-color: var(--red); color: var(--red); }
.choice-btn:disabled { opacity: 0.75; cursor: default; }
.choice-key {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 5px; font-size: 11px;
  background: rgba(0,0,0,0.07); color: var(--muted); font-weight: 800;
  margin-right: 10px; flex-shrink: 0; font-family: monospace;
}
@media (max-width: 640px) { .choice-key { display: none; } }

.result-box { margin-top: 20px; padding: 16px; border-radius: var(--radius); }
.result-box.ok { background: #e8f9ee; border: 1.5px solid var(--green); }
.result-box.ng { background: #fdecea; border: 1.5px solid var(--red); }
.result-box .result-icon { font-size: 28px; text-align: center; margin-bottom: 8px; }
.result-box .result-word { font-size: 22px; font-weight: 900; text-align: center; color: var(--primary-dark); margin-bottom: 6px; }
.result-box .result-meanings { font-size: 14px; color: var(--muted); text-align: center; }
.result-box .result-meanings span { display: inline-block; padding: 2px 8px; }

/* Typing */
.typing-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
.typing-input-row input { font-size: 16px; font-weight: 600; }
.submit-btn {
  padding: 10px 20px; background: var(--primary); color: #fff;
  font-weight: 700; font-size: 15px; flex-shrink: 0; white-space: nowrap;
  width: auto !important;
}

/* ── List Mode ── */
.list-filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-btn { padding: 7px 14px; font-size: 13px; font-weight: 600; background: var(--primary-light); color: var(--primary-dark); border-radius: 999px; }
.filter-btn.active { background: var(--primary); color: #fff; }
.word-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.word-table th { background: var(--primary); color: #fff; padding: 10px 14px; text-align: left; font-size: 13px; }
.word-table td { padding: 9px 14px; font-size: 14px; border-bottom: 1px solid #f0f5f2; }
.word-table tr:last-child td { border-bottom: none; }
.word-table tr:hover td { background: var(--primary-light); }
.word-table .td-no { color: var(--muted); font-size: 12px; width: 44px; }
.word-table .td-word { font-weight: 700; }
.word-table .td-meaning { color: var(--muted); font-size: 13px; }
.wrong-badge { display: inline-block; background: var(--red); color: #fff; border-radius: 999px; font-size: 10px; padding: 1px 6px; margin-left: 6px; }
/* ── セーブデータ ── */
.slot-chip { display: inline-block; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; font-weight: 700; color: var(--primary-dark); }
.slot-sub-name { font-weight: 600; color: var(--muted); font-size: 13px; }
.slot-help { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
.slot-card { background: #fff; border: 1.5px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.slot-card.active { border-color: var(--primary); background: var(--primary-light); }
.slot-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.slot-name { font-weight: 800; font-size: 16px; word-break: break-all; }
.slot-active-badge { background: var(--primary); color: #fff; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px; }
.slot-when { margin-left: auto; font-size: 12px; color: var(--muted); }
.slot-cover { margin-top: 10px; font-size: 14px; font-weight: 700; line-height: 1.5; }
.slot-none { color: var(--muted); font-weight: 600; }
.slot-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.slot-strip { display: grid; grid-template-columns: repeat(50, 1fr); gap: 1px; height: 12px; margin-top: 10px; }
.slot-strip i { background: #dbe8df; border-radius: 1px; display: block; }
.slot-card.active .slot-strip i:not([style]) { background: #cfe0d5; }
.slot-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 2px; }
.slot-meta { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
.slot-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.slot-btn { padding: 9px 13px; font-size: 13px; font-weight: 700; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; color: var(--primary-dark); min-height: 38px; }
.slot-btn.main { background: var(--primary); border-color: var(--primary); color: #fff; }
.slot-btn.danger { color: var(--red); border-color: #f0c9c9; }
.slot-new { width: 100%; margin-top: 4px; }
.slot-new[disabled] { opacity: 0.5; }

/* 間違いの状態（要復習 / 克服中 / 克服済み）*/
.st-badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 2px 8px; white-space: nowrap; }
.st-review { background: #fdecea; color: var(--red); }
.st-recovering { background: #fff4d6; color: #8a5a00; }
.st-mastered { background: #e3f4e8; color: #1f6b3a; }
.st-miss { font-weight: 800; }
.word-table .td-word .st-badge { margin-left: 6px; vertical-align: middle; }
.st-row { margin: -6px 0 10px; }
.st-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.st-dot-review { background: #c8453f; }
.st-dot-recovering { background: #c58a12; }
.st-dot-mastered { background: #2f8f58; }
.st-x { font-size: 11px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
.st-line { font-size: 13px; font-weight: 700; margin-top: 8px; }
.st-line-review { color: var(--red); }
.st-line-recovering { color: #8a5a00; }
.st-line-mastered { color: #1f6b3a; }

/* ── Mode Selector ── */
.mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.mode-option {
  padding: 16px; font-size: 14px; font-weight: 700;
  background: #fff; color: var(--text);
  border-radius: var(--radius); border: 2px solid var(--border);
  text-align: center;
}
.mode-option.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary-dark); }
.mode-option .mode-icon { font-size: 22px; display: block; margin-bottom: 6px; }

/* ── Big Action Buttons ── */
.btn-primary {
  padding: 14px 28px; background: var(--primary); color: #fff;
  font-weight: 800; font-size: 16px; width: 100%; margin-top: 8px;
  border-radius: var(--radius);
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary {
  padding: 12px 20px; background: var(--primary-light); color: var(--primary-dark);
  font-weight: 700; font-size: 14px; border-radius: var(--radius);
  border: 1.5px solid var(--border);
}
.btn-danger { background: #fdecea; color: var(--red); border: 1.5px solid var(--red); }
.btn-sm { padding: 8px 14px; font-size: 13px; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

/* ── Score Screen ── */
.score-card {
  background: #fff; border-radius: var(--radius); padding: 32px 24px;
  box-shadow: var(--shadow); text-align: center; max-width: 500px; margin: 0 auto;
}
.score-card .big-score { font-size: 56px; font-weight: 900; color: var(--primary-dark); line-height: 1; }
.score-card .score-label { font-size: 14px; color: var(--muted); margin-top: 8px; margin-bottom: 24px; }

/* ── Data Tools ── */
.data-section { background: #fff; border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 14px; }
.data-section h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
.stat-chip { background: var(--primary-light); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--primary-dark); }

/* Next btn */
.next-btn {
  padding: 14px; background: var(--primary); color: #fff;
  font-weight: 800; font-size: 16px; width: 100%; margin-top: 16px;
  border-radius: var(--radius);
}

/* Empty state */
.empty { text-align: center; padding: 48px 24px; color: var(--muted); font-size: 15px; }

/* Scrollable content area */
.scroll-list { max-height: 70vh; max-height: 70dvh; overflow-y: auto; border-radius: var(--radius); }


/* ══════════════════════════════════════════
   📱 MOBILE ONLY  (max-width: 640px)
   ══════════════════════════════════════════ */
@media (max-width: 640px) {

  /* ── Bottom Navigation ── */
  #nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
    justify-content: space-around;
    border-top: 1px solid var(--border);
    border-bottom: none;
    box-shadow: 0 -2px 16px rgba(0,0,0,0.10);
    z-index: 200;
    background: #fff;
    gap: 0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 2px;
    border-radius: 10px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.01em;
    background: transparent;
    color: var(--muted);
    border: none;
    min-width: 0;
  }
  .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
  .nav-btn.active {
    background: var(--primary-light);
    color: var(--primary-dark);
    border: none;
  }

  /* ── Top Bar ── */

  /* ── Content area: leave room for bottom nav ── */
  #content {
    padding: 12px 12px calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px));
  }

  /* ── Range picker（折りたたみ式: 閉じている間は1行だけ表示） ── */
  .range-bar {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    padding: 0;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .range-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 10px 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--primary-dark);
    background: #fff;
    border: none;
    border-radius: var(--radius);
    min-height: 44px; /* タップしやすい最小サイズ */
  }
  .range-carry { padding: 0 12px 10px; }
  .range-carry-btn { min-height: 40px; }
  .range-summary-chevron { transition: transform 0.15s; color: var(--muted); }
  .range-bar.open .range-summary-chevron { transform: rotate(180deg); }
  .range-body {
    display: none;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 4px 12px 12px;
    border-top: 1px solid var(--border);
  }
  .range-bar.open .range-body { display: flex; }
  .range-body > span {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding-top: 10px;
  }
  .range-bar input[type=number] { width: 64px; padding: 8px; font-size: 14px; }

  /* ── Study mode ── */
  .study-layout { grid-template-columns: 1fr; gap: 0; }

  /* Tab switcher for study on mobile */
  .study-tabs {
    display: flex;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius) var(--radius) 0 0;
    overflow: hidden;
    border-bottom: none;
  }
  .study-tab-btn {
    flex: 1; padding: 11px 8px;
    font-size: 13px; font-weight: 700;
    background: #fff; color: var(--muted);
    border: none; border-radius: 0;
    border-bottom: 2px solid transparent;
  }
  .study-tab-btn.active { color: var(--primary-dark); border-bottom-color: var(--primary); background: var(--primary-light); }

  .study-list-panel {
    /* 上部バー + 範囲ピッカー(閉じた状態 約44px) + タブ(約44px) + 下部ナビ + 余白 を除いた高さ */
    max-height: calc(100dvh - var(--top-h) - var(--nav-h) - 44px - 44px - 32px - env(safe-area-inset-bottom, 0px));
    border-radius: 0 0 var(--radius) var(--radius);
    border-top: none;
  }
  .word-list-item { padding: 12px 14px; }
  .word-list-item .w { font-size: 15px; }

  .study-detail { border-radius: 0 0 var(--radius) var(--radius); padding: 18px 16px 0; min-height: 0; }
  .study-detail .word-en { font-size: 30px; }
  .study-detail .word-num { margin-bottom: 10px; }
  .study-detail .meanings-list { margin-bottom: 14px; }
  .study-detail .meanings-list li { font-size: 15px; padding: 8px 0; }

  /* 「前へ/次へ」は下部ナビの直上に position:fixed で固定する。
     以前は sticky だったため、意味や例文が短い単語だとボタンが内容の直下に来て、
     単語ごとに位置が上下していた。fixed なら内容の長さに関わらず常に同じ場所になる。
     内容側には下余白（.study-detail の padding-bottom）を入れ、例文が裏に隠れないようにする。 */
  .study-nav-row {
    position: fixed;
    left: 0; right: 0;
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
    background: #fff;
    margin: 0;
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
    gap: 10px;
    z-index: 20;
  }
  .study-nav-row button { padding: 13px; font-size: 15px; }

  /* ── Quiz / Test ── */
  .quiz-card {
    padding: 16px 14px;
    border-radius: var(--radius);
    box-shadow: none;
    border: 1px solid var(--border);
  }
  .quiz-question { font-size: 20px; margin-bottom: 20px; }
  .quiz-progress { font-size: 12px; margin-bottom: 12px; }

  .choices { gap: 8px; }
  .choice-btn {
    padding: 15px 14px;
    font-size: 15px;
    min-height: 52px;
    line-height: 1.3;
  }

  .result-box { margin-top: 14px; padding: 14px; }
  .result-box .result-word { font-size: 20px; }
  .result-box .result-meanings { font-size: 13px; }

  /* クイズ系の「次へ」: 以前は position:sticky で画面下に固定していたが、
     回答後の結果ボックス(正解の意味)の上に重なって隠してしまっていた。
     通常のフローに置いて結果ボックスの直下に出し、回答後は JS(scrollResultIntoView)で
     ボタンまで見える位置にスクロールする。 */
  .next-btn {
    font-size: 16px;
    padding: 15px;
    margin-top: 12px;
  }
  .study-nav-row .next-btn { margin-top: 0; }
  /* 固定された「前へ/次へ」行(約68px)の裏に内容が入り込まない分の余白 */
  .study-detail { padding-bottom: 84px; }

  /* ── Typing ── */
  .typing-input-row { gap: 8px; }
  .typing-input-row input { font-size: 17px; padding: 13px 14px; }
  .submit-btn { padding: 13px 18px; font-size: 15px; }

  /* ── Mode selector ── */
  .mode-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-option { padding: 14px 10px; font-size: 13px; }
  .mode-option .mode-icon { font-size: 24px; margin-bottom: 4px; }

  /* ── Score card ── */
  .score-card { padding: 28px 18px; }
  .score-card .big-score { font-size: 48px; }
  .btn-row { gap: 8px; }
  .btn-row .btn-secondary { flex: 1; text-align: center; }

  /* ── Word list (table → card style) ── */
  .word-table thead { display: none; }
  .word-table, .word-table tbody, .word-table tr, .word-table td {
    display: block; width: 100%;
  }
  .word-table tr {
    padding: 10px 14px;
    border-bottom: 1px solid #f0f5f2;
    background: #fff;
  }
  .word-table tr:hover td { background: transparent; }
  .word-table tr:hover { background: var(--primary-light); }
  .word-table td { padding: 0; border: none; }
  .word-table .td-no {
    font-size: 10px; color: var(--muted);
    margin-bottom: 2px; display: block;
  }
  .word-table .td-word {
    font-size: 16px; font-weight: 800;
    color: var(--text); display: block;
    margin-bottom: 3px;
  }
  .word-table .td-meaning {
    font-size: 13px; color: var(--muted);
    display: block; line-height: 1.5;
  }
  .scroll-list { max-height: calc(100dvh - var(--top-h) - var(--nav-h) - 190px - env(safe-area-inset-bottom, 0px)); }

  /* ── Settings ── */
  .stat-row { gap: 8px; }
  .stat-chip { font-size: 12px; padding: 7px 12px; }
  .data-section { padding: 14px; }

  /* ── Headings ── */
  h2[style*="font-size:18px"] { font-size: 16px !important; }

  /* ── Buttons general ── */
  .btn-primary { padding: 15px; font-size: 16px; }
  .btn-secondary { padding: 12px 16px; font-size: 13px; }

  /* ── Empty state ── */
  .empty { padding: 36px 16px; }
}

/* ── 学習：意味を隠すシート ── */
.word-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.study-detail .word-meta-row .word-num { margin-bottom: 0; }
.hide-toggle-btn {
  padding: 6px 12px; font-size: 12px; font-weight: 700; border-radius: 999px;
  background: #fff; color: var(--muted); border: 1.5px solid var(--border);
}
.hide-toggle-btn.on { background: var(--primary); color: #fff; border-color: var(--primary-dark); }
.reveal-area { position: relative; margin-bottom: 20px; min-height: 56px; }
.study-detail .reveal-area .meanings-list { margin-bottom: 0; }
.reveal-sheet { display: none; }
.study-detail.covered .reveal-sheet {
  display: flex; align-items: center; justify-content: center; text-align: center;
  position: absolute; inset: 0; z-index: 2; cursor: pointer;
  background: repeating-linear-gradient(135deg, #bfe3cd 0 10px, #b3dcc3 10px 20px);
  border: 2px dashed var(--primary); border-radius: 10px;
  color: var(--primary-dark); font-weight: 800; font-size: 15px;

}

/* ── 線画アイコン ── */
.ico { width: 1em; height: 1em; flex: none; display: inline-block; vertical-align: -0.125em; }
.h-ico { display: inline-flex; margin-right: 8px; color: var(--primary); vertical-align: -3px; }

}
.study-tab-btn { display: flex; align-items: center; justify-content: center; gap: 6px; }
.study-tab-btn .ico { width: 16px; height: 16px; }
.mode-option .mode-icon .ico { width: 24px; height: 24px; }
.speak-btn { color: var(--primary-dark); }
.speak-btn .ico { width: 20px; height: 20px; }
.hide-toggle-btn { display: inline-flex; align-items: center; gap: 6px; }
.hide-toggle-btn .ico { width: 14px; height: 14px; }
.study-detail.covered .reveal-sheet { gap: 8px; }

/* ── 復習状況マーク（丸＋文字） ── */
.sdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; flex: none; }

.st-badge .st-miss { color: var(--muted); }

.st-counts { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
.st-counts > span { display: inline-flex; align-items: center; }
.st-counts .sdot { margin-right: 4px; }


/* ── 一覧：復習状況を右の独立した列に ── */
.word-table .th-status { text-align: right; }
.word-table .td-status { text-align: right; white-space: nowrap; width: 150px; }
.word-table .td-word { padding-right: 12px; }
@media (max-width: 640px) {
  .word-table tr { display: grid; grid-template-columns: 1fr auto; column-gap: 12px; align-items: center; }
  .word-table .td-no { grid-column: 1 / -1; }
  .word-table .td-word { grid-column: 1; grid-row: 2; margin-bottom: 0; padding-right: 0; }

/* ── 設定ページ ── */
.set-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 6px rgba(20,50,35,0.05); }

.set-help { font-size: 13px; line-height: 1.7; color: var(--muted); margin-bottom: 14px; }

.stat-tiles.three { grid-template-columns: repeat(3, 1fr); margin-bottom: 0; }
.stat-tile { background: #f7faf8; border: 1px solid #e6efe9; border-radius: 12px; padding: 12px 12px 11px; min-width: 0; }
.stat-tile .v { font-size: 22px; font-weight: 800; color: var(--primary-dark); line-height: 1.2; font-variant-numeric: tabular-nums; }

.seg { display: flex; background: #eef4f0; border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; padding: 10px 6px; font-size: 14px; font-weight: 700; background: transparent; color: var(--muted); border-radius: 9px; }
.seg button.active { background: #fff; color: var(--primary-dark); box-shadow: 0 1px 4px rgba(20,50,35,0.15); }
.act-row { display: flex; gap: 10px; }
.act-btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 10px; font-size: 14px; font-weight: 700; background: #fff; color: var(--primary-dark); border: 1.5px solid var(--border); border-radius: 12px; }
.act-btn .ico { width: 17px; height: 17px; }
.act-btn:hover { background: var(--primary-light); }
.set-card.danger { border-color: #efd3d1; }
.set-card.danger .set-ico { background: #fdecea; color: #b8403a; }
.dz-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid #f3e6e5; }

@media (max-width: 640px) {

  .stat-tile .v { font-size: 20px; }
  .dz-row { gap: 10px; }
  .dz-btn { padding: 9px 12px; }
}

@media (max-width: 640px) {

#content[data-dense="4"] .quiz-quit, #content[data-dense="5"] .quiz-quit { top: 2px; right: 4px; padding: 1px 8px; font-size: 11px; }

/* ── 記録ページ ── */
:root { --c-mastered: #2f8f58; --c-recovering: #c58a12; --c-review: #c8453f; --c-none: #dbe5de; }
.rec-wrap { display: flex; flex-direction: column; gap: 10px; max-width: 720px; margin: 0 auto; }
.rec-seg button { padding: 8px 2px; font-size: 13px; }
.rec-pane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
.rec-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; flex: none; }
.rec-tile { background: #f7faf8; border: 1px solid #e6efe9; border-radius: 12px; padding: 10px 12px; }
.rec-tile .v { font-size: 22px; font-weight: 800; color: var(--primary-dark); line-height: 1.2; font-variant-numeric: tabular-nums; }

.rec-card.grow { flex: 1 1 0; min-height: 150px; display: flex; flex-direction: column; }
.rec-card.grow2 { flex: 1 1 0; min-height: 130px; display: flex; flex-direction: column; }
.rec-card.list { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.rec-stack { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--c-none); }
.rec-stack.thin { height: 10px; }
.rec-stack i { display: block; height: 100%; }
.rec-leg { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 8px; font-size: 11.5px; font-weight: 600; }
.rec-leg b { font-weight: 800; font-variant-numeric: tabular-nums; }
.rec-leg span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--c); }
.rec-bars { display: flex; align-items: flex-end; gap: 6px; height: 74px; }
.rec-bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; font-size: 10px; color: var(--muted); height: 100%; }
.rec-bars i { display: block; width: 100%; border-radius: 4px 4px 0 0; background: #9fd0b5; }
.rec-bars .tdy i { background: var(--primary); }
.rec-chips { display: flex; gap: 6px; flex: none; }
.rec-chips button { flex: 1; padding: 7px 0; border-radius: 999px; font-size: 13px; font-weight: 700; background: #eef4f0; color: var(--muted); }
.rec-chips button.on { background: var(--primary); color: #fff; }
.rec-chart { position: relative; flex: 1; min-height: 80px; }
.rec-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.rec-axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.rec-heat { display: grid; grid-template-columns: repeat(26, 1fr); grid-template-rows: repeat(7, auto); grid-auto-flow: column; gap: 2px; }

.rec-heat i.l1 { background: #c7e6d3; } .rec-heat i.l2 { background: #9fd0b5; } .rec-heat i.l3 { background: #5fb584; } .rec-heat i.l4 { background: #2d7a4f; } .rec-heat i.fut { background: transparent; }

.rec-mini { display: inline-flex; background: #eef4f0; border-radius: 8px; padding: 2px; gap: 2px; }

.rec-rank span { font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.rec-rank .n { width: 16px; font-weight: 800; }
.rec-empty { font-size: 12.5px; color: var(--muted); line-height: 1.7; padding: 10px 0; text-align: center; }
.rec-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.rec-sess { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 10px; padding: 9px 0; border-top: 1px solid #f0f5f2; align-items: center; }

.rec-sess b { font-size: 13px; }
.rec-sess small { font-size: 11px; color: var(--muted); font-weight: 600; }

.rec-sess .sc small { display: block; font-weight: 600; }

/* 高さが足りないときは、余白を詰める */

/* ── マークしたことの知らせ（キーで切り替えたとき） ── */

  padding: 8px 16px; border-radius: 999px; background: rgba(26,46,34,0.92); color: #fff; font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
#mark-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── 学習（スマホ）：縦のスクロールはブラウザに任せ、横のスライドは単語の移動に使う ── */
@media (max-width: 640px) {

function loadStorage() {

function slotSummary(d) {

  const nos = []; let answers = 0, correct = 0;

  }
  nos.sort((a, b) => a - b);
  const ranges = [];                                  // 解答済みの連続した番号を区間にまとめる
  for (const n of nos) {
    const L = ranges[ranges.length - 1];
    if (L && n === L[1] + 1) L[1] = n; else ranges.push([n, n]);
  }
  const st = { review: 0, recovering: 0, mastered: 0, ever: 0 };
  for (const k in miss) {
    const r = miss[k];
    if (r && r.n > 0) { st.ever++; if (r.s >= N) st.mastered++; else if (r.s === 0) st.review++; else st.recovering++; }
  }
  const SEG = 50, per = MAX_NO / SEG, bucket = new Array(SEG).fill(0);   // 全体を50区間に分け、各区間の解答済み割合を出す
  nos.forEach(n => { bucket[Math.min(SEG - 1, Math.floor((n - 1) / per))]++; });

function fmtCoverage(ranges) {
  if (!ranges.length) return '';
  const top = [...ranges].sort((x, y) => (y[1] - y[0]) - (x[1] - x[0]) || x[0] - y[0]).slice(0, 3).sort((x, y) => x[0] - y[0]);
  const rest = ranges.length - top.length;
  return top.map(r => fmtRange(r[0], r[1])).join('、') + (rest > 0 ? ` ほか${rest}区間` : '');
}
function fmtWhen(ms) {
  if (!ms) return '';

  const day0 = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day0(now) - day0(d)) / 86400000);
  if (diff === 0) return `今日 ${hm}`;
  if (diff === 1) return `昨日 ${hm}`;
  return `${d.getMonth() + 1}/${d.getDate()} ${hm}`;
}

function activeSlotName() { const m = slotIndex.meta[slotIndex.active]; return m ? m.name : ''; }

function askSlotName(label, def) {

}
function createSlot(name, data) {
  const id = newSlotId();
  if (!writeSlotData(id, data)) { alert('保存できませんでした。ブラウザの保存領域がいっぱい、または使えない設定の可能性があります。'); return null; }
  slotIndex.order.push(id); slotIndex.meta[id] = { name, createdAt: Date.now(), nameAt: Date.now() };

}
function switchSlot(id) {
  if (!slotIndex.meta[id]) return;

  const d = readSlotData(id);
  if (!d) { alert('このセーブデータを読み込めませんでした。'); return; }

}

window.newSlot = function() {
  if (slotIndex.order.length >= MAX_SLOTS) { alert(`セーブデータは最大${MAX_SLOTS}個までです。不要なものを削除してください。`); return; }

};
window.duplicateSlot = function(id) {
  if (slotIndex.order.length >= MAX_SLOTS) { alert(`セーブデータは最大${MAX_SLOTS}個までです。不要なものを削除してください。`); return; }
  const src = id === slotIndex.active ? currentSlotData() : readSlotData(id);
  if (!src || !slotIndex.meta[id]) return;
  const name = (slotIndex.meta[id].name + 'のコピー').slice(0, SLOT_NAME_MAX);

window.deleteSlot = function(id) {
  const m = slotIndex.meta[id];
  if (!m || slotIndex.order.length <= 1) { alert('最後のセーブデータは削除できません。'); return; }
  const wasActive = id === slotIndex.active;
  if (!confirm(`セーブデータ「${m.name}」を削除しますか？\n（解答履歴・間違えた単語の記録も消え、取り消せません）` + (wasActive ? '\n※使用中のため、別のセーブデータに切り替わります' : ''))) return;
  try { localStorage.removeItem(slotKey(id)); } catch (e) {}
  delete slotIndex.meta[id];
  slotIndex.deleted = slotIndex.deleted || {}; slotIndex.deleted[id] = Date.now();   // 他の端末にも削除を伝える
  slotIndex.order = slotIndex.order.filter(x => x !== id);
  scheduleSync('all');
  if (wasActive) { slotIndex.active = slotIndex.order[0]; applySlotData(readSlotData(slotIndex.active)); }
  writeSlotIndex();

// ── HELPERS ──
function getRange(start, end) {
  return WORDS.filter(w => w.no >= start && w.no <= end);
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// 出題に使う意味を選ぶ。意味が複数ある単語は「1つ目 > 2つ目 > 3つ目…」の順に出やすくする。
// 重み = 1 / (順位^2)  例) 2つ→80%/20%、3つ→73%/18%/8%、4つ→70%/18%/8%/4%
// （以前は全部同じ確率だったため、マニアックな2つ目以降の意味が頻繁に出ていた）
const MEANING_WEIGHT_POWER = 2;   // 大きいほど1つ目に偏る（1=緩やか、3=かなり偏る）
function randMeaning(w) {
  const ms = w.meanings;
  if (ms.length <= 1) return ms[0];
  const ws = ms.map((_, i) => 1 / Math.pow(i + 1, MEANING_WEIGHT_POWER));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ms.length; i++) { r -= ws[i]; if (r <= 0) return ms[i]; }
  return ms[0];
}
// 誤答候補が正解と同じ意味を持つ（=どちらを選んでも正解になり得る）場合、
// その候補は出題プールから除外する。意味が1対1で被らない語だけを誤答候補にする。
function getChoices(correct, pool, correctMeaning) {
  const others = pool.filter(w => {
    if (w.no === correct.no) return false;
    if (correctMeaning != null && w.meanings.includes(correctMeaning)) return false;
    return true;
  });
  const shuffled = shuffle(others).slice(0, 3);
  const choices = shuffle([correct, ...shuffled]);
  return choices;
}
// 回答後に「結果ボックス＋次へ」ボタンが画面外に出てしまうのを防ぐ。
// 下部ナビ（固定）の上に収まるよう、結果エリアの末尾までスクロールする。
function scrollResultIntoView(containerId) {
  setTimeout(() => {
    const box = document.getElementById(containerId);
    if (!box) return;
    const target = box.querySelector('.next-btn') || box;
    const navH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-h')) || 0;
    const rect = target.getBoundingClientRect();
    const safeBottom = window.innerHeight - navH - 12;
    if (rect.bottom > safeBottom) {
      window.scrollBy({ top: rect.bottom - safeBottom, behavior: 'smooth' });
    }
  }, 60);
}
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
// タイピング判定用の正規化: 前後の空白除去・小文字化に加え、
// 全角スペースや連続する空白を単一の半角スペースに、末尾の余分なピリオドを除去する。
// スペルの意味を変えない範囲での表記ゆれのみを吸収する（綴りの違い自体は許容しない）。
// 正解として受け付ける綴りの一覧。語末が "(s)" の語（例: afterward(s)）は、
// sあり・sなし・括弧つきのどれで入力しても正解にする。
function typingAnswers(word) {
  const base = normalizeTypingInput(word);
  const m = base.match(/^(.*)\(s\)$/);
  return m ? [base, m[1], m[1] + 's'] : [base];
}
function isTypingMatch(val, word) { return typingAnswers(word).includes(normalizeTypingInput(val)); }
function normalizeTypingInput(s) {
  return s
    .replace(/\u3000/g, ' ')
    .trim()
    .toLowerCase()
    .replace(/\s+/g, ' ')
    .replace(/\.+$/, '');
}

// ── SECTION ROUTER ──
function showSection(name) {
  state.section = name;
  document.querySelectorAll('.section').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.nav-btn').forEach((btn, i) => {
    const names = ['study','test','typing','review','wordlist','record','settings'];
    btn.classList.toggle('active', names[i] === name);
  });
  const sec = document.getElementById('section-' + name);
  sec.style.display = 'block';
  if (quizInProgress(name)) {
    // 進行中の問題はそのまま残して、続きから再開する（ページを移動しても中断されない）
    const inp = sec.querySelector('#typing-input, #review-typing-input');
    if (inp && !inp.disabled && !inp.readOnly) setTimeout(() => inp.focus(), 50);
    window.__qStart = Date.now();     // 戻ってきたところから解答時間を測り直す
    window.scrollTo(0, 0);
  } else {
    renderSection(name);
  }
  if (QUIZ_SECTIONS.includes(name)) fitQuizPage();
}
const QUIZ_SECTIONS = ['test', 'typing', 'review'];
// そのセクションに、解答中の問題（quiz-card）が表示されているか
function quizInProgress(name) {
  return QUIZ_SECTIONS.includes(name) && !!document.querySelector('#section-' + name + ' .quiz-card');
}
// 「中断」ボタン：進行中のテストをやめて、設定画面に戻る
window.quitQuiz = function() {
  if (!confirm('テストを中断して、設定画面に戻りますか？\n（ここまでの解答は記録されています）')) return;
  endSession(state.section);      // ここまでの分を、結果の履歴に残す
  renderSection(state.section);
  window.scrollTo(0, 0);
  fitQuizPage();
};

function renderSection(name) {
  switch(name) {
    case 'study': renderStudy(); break;
    case 'test': renderTestSetup(); break;
    case 'typing': renderTypingSetup(); break;
    case 'review': renderReview(); break;

}

// ── RANGE WIDGET ──
// モバイルでは縦に長くなり画面の大半を占有してしまうため、現在の範囲を1行で表示し
// タップで展開する折りたたみ式にする（デスクトップでは常に展開）。
window._rangeOpen = window._rangeOpen || {};
// ユーザーが実際に範囲を指定したページ（初期値のままのページは引き継ぎ候補に出さない）
window._rangeTouched = window._rangeTouched || {};
const RANGE_PAGES = [
  { id: 'study',  label: '学習',       get: () => [state.studyStart,  state.studyEnd],  set: (s, e) => { state.studyStart = s;  state.studyEnd = e; } },
  { id: 'test',   label: 'テスト',     get: () => [state.testStart,   state.testEnd],   set: (s, e) => { state.testStart = s;   state.testEnd = e; } },
  { id: 'typing', label: 'タイピング', get: () => [state.typingStart, state.typingEnd], set: (s, e) => { state.typingStart = s; state.typingEnd = e; } },
];
// 他ページで指定済みの範囲を、ワンタップで適用できるボタン群を返す。
// 現在の範囲と同じもの・未指定のページは出さない。同じ範囲は1つにまとめる。
function rangeCarryHtml(id, start, end) {
  const seen = new Map();
  for (const p of RANGE_PAGES) {
    if (p.id === id || !window._rangeTouched[p.id]) continue;
    const [s, e] = p.get();
    if (!s || !e || (s === start && e === end)) continue;
    const key = s + '-' + e;
    if (!seen.has(key)) seen.set(key, { s, e, labels: [] });
    seen.get(key).labels.push(p.label);
  }
  if (!seen.size) return '';
  const btns = [...seen.values()].map(v =>
    `<button type="button" class="range-carry-btn" onclick="applyRangePreset('${id}',${v.s},${v.e})">↪ ${v.labels.join('・')}と同じ範囲 <b>No.${v.s}〜${v.e}</b></button>`
  ).join('');
  return `<div class="range-carry">${btns}</div>`;
}
window.toggleRange = function(id) {
  window._rangeOpen[id] = !window._rangeOpen[id];
  const bar = document.getElementById('rbar-' + id);
  if (bar) bar.classList.toggle('open', !!window._rangeOpen[id]);
  if (state.section === 'study') fitStudyLayout();
};
function rangeWidget(id, start, end, onApply) {
  const isOpen = !!window._rangeOpen[id];
  let html = `<div class="range-bar ${isOpen ? 'open' : ''}" id="rbar-${id}">
    <button type="button" class="range-summary" onclick="toggleRange('${id}')" aria-expanded="${isOpen}">
      <span class="range-summary-text">範囲 No.${start}〜${end}</span>
      <span class="range-summary-chevron">▾</span>
    </button>
    ${rangeCarryHtml(id, start, end)}
    <div class="range-body">
    <span><label>No.</label>&nbsp;
    <input type="number" id="r-start-${id}" value="${start}" min="1" max="${MAX_NO}" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();applyRange('${id}');}" style="width:76px">
    &nbsp;〜&nbsp;
    <input type="number" id="r-end-${id}" value="${end}" min="1" max="${MAX_NO}" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" onkeydown="if(event.key==='Enter'){event.preventDefault();applyRange('${id}');}" style="width:76px">
    &nbsp;<button class="btn-secondary btn-sm" onclick="applyRange('${id}')">適用</button></span>
    </div></div>`;
  return html;
}
window._rangeCallbacks = {};
// 範囲を [1, MAX_NO] に収め、開始>終了なら入れ替える（空欄・範囲外・逆順の入力対策）
function normalizeRange(s, e) {
  s = parseInt(s); e = parseInt(e);
  if (isNaN(s)) s = 1;
  if (isNaN(e)) e = MAX_NO;
  s = Math.min(Math.max(s, 1), MAX_NO);
  e = Math.min(Math.max(e, 1), MAX_NO);
  if (s > e) { const t = s; s = e; e = t; }
  return [s, e];
}
function applyRange(id) {
  const [s, e] = normalizeRange(
    document.getElementById('r-start-'+id).value,
    document.getElementById('r-end-'+id).value);
  window._rangeOpen[id] = false; // 範囲を決めたら畳んでコンテンツを見せる
  window._rangeTouched[id] = true;
  if (window._rangeCallbacks[id]) window._rangeCallbacks[id](s, e);
  saveStorage();   // 指定した範囲もセーブデータに保存する
}
function applyRangePreset(id, s, e) {
  const el1 = document.getElementById('r-start-'+id), el2 = document.getElementById('r-end-'+id);
  if (el1) el1.value = s;
  if (el2) el2.value = e;
  window._rangeOpen[id] = false;
  window._rangeTouched[id] = true;
  if (window._rangeCallbacks[id]) window._rangeCallbacks[id](s, e);
  saveStorage();
}

  "feasible": "ˈfizəbəl",
  "viable": "ˈvaɪəbəl"
};

// 発音記号 + 🔊 ボタンの1行。IPAが無い語でも🔊だけは出す。
function pronHtml(word) {
  const p = IPA[word];
  const ipaHtml = p ? `<span class="ipa">/${escHtml(p)}/</span>` : '';
  const canSpeak = ('speechSynthesis' in window);
  const spk = canSpeak
    ? `<button type="button" class="speak-btn" data-w="${escHtml(word)}" onclick="speak(this.dataset.w); this.blur();" aria-label="発音を聞く">${icon('speaker')}</button>`
    : '';
  return (ipaHtml || spk) ? `<div class="pron-row">${ipaHtml}${spk}</div>` : '';
}

// ブラウザ内蔵の音声合成で英語(米)を読み上げる。ユーザー操作(タップ)から呼ぶこと（iOS対策）。
function speak(word) {
  if (!('speechSynthesis' in window)) return;
  try {
    const synth = window.speechSynthesis;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(String(word).replace(/\(s\)$/, 's'));   // afterward(s) → afterwards
    u.lang = 'en-US';
    u.rate = 0.85;
    const v = synth.getVoices().find(v => v.lang === 'en-US' || v.lang === 'en_US');
    if (v) u.voice = v;
    synth.speak(u);
  } catch (e) { /* 音声が使えない環境では何もしない */ }
}

function getExample(word) {
  if (EXAMPLES[word]) return EXAMPLES[word];
  return null;
}

function isMobile() { return window.innerWidth <= 640; }

let _resizeTimer = null;
window.addEventListener('resize', () => {

function renderStudy() {

  const words = getRange(state.studyStart, state.studyEnd);
  if (!words.length) { sec.innerHTML = '<div class="empty">この範囲に単語がありません</div>'; return; }

    <div class="study-detail${covered ? ' covered' : ''}" style="${detailStyle}">

      ${pronHtml(cur.word)}
      <div class="word-meta-row">
        <div class="word-num">No.${cur.no} &nbsp;|&nbsp; ${state.studyIdx+1} / ${words.length}</div>
        <button type="button" class="hide-toggle-btn ${state.studyHide ? 'on' : ''}" onclick="studyToggleHide(); this.blur();" aria-pressed="${state.studyHide}">${icon(state.studyHide ? 'eyeoff' : 'eye')}意味を隠す: ${state.studyHide ? 'ON' : 'OFF'}</button>
      </div>
      ${statusBadgeHtml(cur.no) ? `<div class="st-row">${statusBadgeHtml(cur.no)}</div>` : ''}
      <div class="reveal-area">
        <ul class="meanings-list">${cur.meanings.map(m=>`<li>${escHtml(m)}</li>`).join('')}</ul>
        <div class="reveal-sheet" role="button" tabindex="0" aria-label="タップして意味を表示" onclick="studyReveal()">${icon('eye')}タップして意味を表示</div>
      </div>
      ${exHtml}
      </div>
      <div class="study-nav-row">
        <button class="btn-secondary" onclick="studyPrev()">← 前へ</button>
        ${markBtnHtml(cur.no, 'nav')}
        <button id="study-main-btn" class="next-btn" style="flex:1;margin-top:0" onclick="studyAdvance()">${covered ? '意味を見る' : '次へ →'}</button>
      </div>

  fitStudyLayout();

// 学習画面を、ページ全体をスクロールせずに画面内へ収める（PC・スマホ共通）。
// 一覧・詳細パネルの高さを画面の残り高さに合わせ、詳細に収まらない内容は文字を段階的に詰める。
function fitStudyLayout() {
  const lay = document.querySelector('.study-layout');
  if (!lay) return;
  window.scrollTo(0, 0);
  const topV = lay.getBoundingClientRect().top;
  let h;
  if (isMobile()) {
    const nav = document.getElementById('nav');
    const navTop = nav ? nav.getBoundingClientRect().top : window.innerHeight;
    const row = lay.querySelector('.study-nav-row');
    const rowH = (state.studyTab === 'detail' && row) ? row.offsetHeight : 0;   // 前へ/次へは下部ナビの上に固定表示
    const padB = parseFloat(getComputedStyle(document.getElementById('content')).paddingBottom) || 0;
    h = Math.min(navTop - rowH - 8, window.innerHeight - padB) - topV;   // ページ全体が画面より高くならないように
  } else {
    h = Math.min(window.innerHeight - topV - 24, 680);
  }
  lay.classList.add('fit');
  lay.style.height = Math.max(200, Math.floor(h)) + 'px';
  fitStudyContent();
}
// 段階を切り替えた直後に寸法を測るため、その間だけ transition を止める。
// （ボタンに transition: all が付いているので、止めないと「変化前の寸法」を読んで、必要以上に小さくしてしまう）
function measureNoTransition(fn) {
  const html = document.documentElement;
  html.classList.add('no-trans');
  try { return fn(); } finally { void html.offsetHeight; html.classList.remove('no-trans'); }
}
function fitQuizPage() {
  const root = document.getElementById('content');
  if (!root) return;
  if (!QUIZ_SECTIONS.includes(state.section) || !document.querySelector('#section-' + state.section + ' .quiz-card')) { delete root.dataset.dense; return; }
  measureNoTransition(() => {
    for (let lv = 0; lv <= 5; lv++) {
      root.dataset.dense = lv;
      if (document.documentElement.scrollHeight <= window.innerHeight) break;
    }
  });
}
(function () {
  const root = document.getElementById('content');
  if (!root) return;
  let queued = false;
  const run = () => { queued = false; fitQuizPage(); };
  new MutationObserver(() => { if (!queued) { queued = true; requestAnimationFrame(run); } }).observe(root, { childList: true, subtree: true });
  window.addEventListener('resize', fitQuizPage);
})();
function fitStudyContent() {
  const det = document.querySelector('.study-detail');
  const body = det && det.querySelector('.study-body');
  if (!body || det.offsetParent === null) return;
  measureNoTransition(() => {
    for (let lv = 0; lv <= 4; lv++) {
      det.dataset.density = lv;
      if (body.scrollHeight <= body.clientHeight + 1) break;
    }
  });
}
window.addEventListener('resize', () => { if (state && state.section === 'study') fitStudyLayout(); });
window.studyTab = function(tab) { state.studyTab = tab; renderStudy(); };
window.studySelect = function(i) {
  if (i !== state.studyIdx) state.studyRevealed = false;
  state.studyIdx = i;
  recordStudyPos();
  if (isMobile()) state.studyTab = 'detail';
  renderStudy();
};
window.studyNext = function() {
  const words = getRange(state.studyStart, state.studyEnd);
  const ni = Math.min(state.studyIdx + 1, words.length - 1);
  if (ni !== state.studyIdx) state.studyRevealed = false;
  state.studyIdx = ni;
  recordStudyPos();
  renderStudy();
};
window.studyPrev = function() {
  const pi = Math.max(state.studyIdx - 1, 0);
  if (pi !== state.studyIdx) state.studyRevealed = false;
  state.studyIdx = pi;
  recordStudyPos();
  renderStudy();
};
// 意味を表示する（再描画せずシートだけ外すので、画面位置は動かない）
window.studyReveal = function() {
  if (!state.studyHide || state.studyRevealed) return;
  state.studyRevealed = true;
  const det = document.querySelector('.study-detail');
  if (det) det.classList.remove('covered');
  const btn = document.getElementById('study-main-btn');
  if (btn) btn.textContent = '次へ →';
  const m = document.querySelector('.word-list-item.selected .m');
  if (m) m.classList.remove('m-hidden');
};
// メインボタン／→・Space・Enter：意味が隠れていれば表示、表示済みなら次の単語へ
window.studyAdvance = function() {
  if (state.studyHide && !state.studyRevealed) studyReveal();
  else studyNext();
};
window.studyToggleHide = function() {
  state.studyHide = !state.studyHide;
  state.studyRevealed = false;
  saveStudyHide(state.studyHide);
  renderStudy();
};

function renderTestSetup() {
  const sec = document.getElementById('section-test');
  state.testStart = state.testStart || 1;
  state.testEnd = state.testEnd || 50;
  window._rangeCallbacks['test'] = (s,e) => { state.testStart=s; state.testEnd=e; renderTestSetup(); };
  const modeButtons = ['en2jp','jp2en'].map(m => {
    const labels = {en2jp:'英語 → 日本語', jp2en:'日本語 → 英語'};
    const active = state.testMode === m ? 'active' : '';
    return `<button class="mode-option ${active}" onclick="setTestMode('${m}')"><span class="mode-icon">${m==='en2jp'?'🇺🇸→🇯🇵':'🇯🇵→🇺🇸'}</span>${labels[m]}</button>`;
  }).join('');
  sec.innerHTML = `<h2 style="font-size:18px;font-weight:800;margin-bottom:14px;"><span class="h-ico">${icon('test')}</span>テストモード</h2>
    ${rangeWidget('test', state.testStart, state.testEnd)}
    <div style="margin-bottom:16px;">
      <div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;">出題形式</div>
      <div class="mode-grid">${modeButtons}</div>
    </div>
    <button class="btn-primary" onclick="startTest()">テスト開始</button>`;
}
window.setTestMode = function(m) { state.testMode = m; renderTestSetup(); };

window.startTest = function() {
  const pool = getRange(state.testStart, state.testEnd);
  if (pool.length < 4) { alert('範囲内の単語が4語以上必要です'); return; }
  state.testQueue = shuffle(pool);
  state.testQIdx = 0; state.testAnswered = false;
  state.testScore = 0; state.testWrong = [];
  beginSession('test', 'No.' + state.testStart + '〜' + state.testEnd);
  renderTestQuestion();
};

function renderTestQuestion() {
  window.__qStart = Date.now();      // 解答時間の計測の開始
  const sec = document.getElementById('section-test');
  const pool = getRange(state.testStart, state.testEnd);
  if (state.testQIdx >= state.testQueue.length) {
    renderTestScore();
    return;
  }
  const cur = state.testQueue[state.testQIdx];
  const total = state.testQueue.length;
  const pct = Math.round(state.testQIdx / total * 100);

  let questionText, choiceContent;
  if (state.testMode === 'en2jp') {
    // 正解の意味を1つ確定させ、それと同じ意味を持つ語は誤答候補から除外する
    const correctMeaning = randMeaning(cur);
    const choices = getChoices(cur, pool, correctMeaning);
    questionText = escHtml(cur.word);
    choiceContent = choices.map((c, i) => {
      const m = (c.no === cur.no) ? correctMeaning : randMeaning(c);
      return `<button class="choice-btn" onclick="answerTest(${c.no},${cur.no})" data-no="${c.no}"><span class="choice-key">${i+1}</span>${escHtml(m)}</button>`;
    }).join('');
  } else {
    const qMeaning = randMeaning(cur);
    // qMeaningを正解の意味として、それを持つ他の単語（=同義語）は誤答候補から除外する
    const choices = getChoices(cur, pool, qMeaning);
    questionText = escHtml(qMeaning);
    choiceContent = choices.map((c, i) => `<button class="choice-btn" onclick="answerTest(${c.no},${cur.no})" data-no="${c.no}"><span class="choice-key">${i+1}</span>${escHtml(c.word)}</button>`).join('');
  }

  sec.innerHTML = `<div class="quiz-card"><button type="button" class="quiz-quit" onclick="quitQuiz()">中断</button>
    <div class="quiz-progress">${state.testQIdx+1} / ${total}</div>
    <div class="quiz-progress-bar"><div class="quiz-progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="quiz-type-label">${state.testMode==='en2jp'?'英語 → 日本語':'日本語 → 英語'}</div>
    <div class="quiz-question">${questionText}</div>
    <div class="choices" id="choices">${choiceContent}</div>
    <div id="result-area"></div>
  </div>`;
}

window.answerTest = function(selectedNo, correctNo) {
  if (state.testAnswered) return;
  state.testAnswered = true;
  const isCorrect = selectedNo === correctNo;
  const cur = WORDS.find(w => w.no === correctNo);

  // Highlight
  document.querySelectorAll('#section-test .choice-btn').forEach(btn => {
    btn.disabled = true;
    const no = parseInt(btn.dataset.no);
    if (no === correctNo) btn.classList.add('correct');
    else if (no === selectedNo && !isCorrect) btn.classList.add('wrong');
  });

  if (isCorrect) { state.testScore++; markCorrect(correctNo); }
  else { state.testWrong.push(cur); markWrong(correctNo); }

  const allMeanings = cur.meanings.map(m => `<span>${escHtml(m)}</span>`).join(' / ');
  const resClass = isCorrect ? 'ok' : 'ng';
  const icon = isCorrect ? '⭕' : '❌';
  document.getElementById('result-area').innerHTML = `
    <div class="result-box ${resClass}">
      ${markBtnHtml(cur.no)}
      <div class="result-icon">${icon}</div>
      <div class="result-word">${escHtml(cur.word)}</div>
      ${pronHtml(cur.word)}
      <div class="result-meanings">${allMeanings}</div>
         ${statusLineHtml(cur.no, isCorrect)}
    </div>
    <button class="next-btn" onclick="nextTest()">次へ →</button>`;
  scrollResultIntoView('result-area');
};

window.nextTest = function() {
  window.scrollTo({ top: 0 });
  state.testQIdx++;
  state.testAnswered = false;
  renderTestQuestion();
};

function renderTestScore() {
  const sec = document.getElementById('section-test');
  const total = state.testQueue.length;
  const pct = Math.round(state.testScore / total * 100);
  let wrongList = state.testWrong.length ?
    state.testWrong.map(w => `<div style="padding:6px 0;border-bottom:1px solid #f0f5f2;font-size:14px;"><b>${escHtml(w.word)}</b> — ${w.meanings.map(m=>escHtml(m)).join(' / ')}</div>`).join('') :
    '<div style="color:var(--green);font-weight:700;padding:12px 0;">全問正解！🎉</div>';

  endSession('test');
    sec.innerHTML = `<div class="score-card">
    <div class="big-score">${pct}%</div>
    <div class="score-label">${state.testScore} / ${total} 正解</div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn-secondary" onclick="startTest()">もう一度</button>
      <button class="btn-secondary" onclick="renderTestSetup()">設定に戻る</button>
    </div>
    ${state.testWrong.length ? `<div style="margin-top:20px;text-align:left"><div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:8px;">間違えた単語 (${state.testWrong.length}語)</div>${wrongList}</div>` : ''}
  </div>`;
}

window.submitTyping = function() {

    <div class="result-box ng">

  if(inp) { inp.value = cur.word; inp.disabled = true; inp.blur(); }
};

window.nextTyping = function() {
  window.scrollTo({ top: 0 });
  state.typingQIdx++; state.typingAnswered = false;
  renderTypingQuestion();
};

function renderTypingScore() {
  const sec = document.getElementById('section-typing');

  let wrongList = state.typingWrong.length ?

    <div class="score-label">${state.typingScore} / ${total} 正解</div>
    <div class="btn-row" style="justify-content:center">

    </div>
    ${state.typingWrong.length ? `<div style="margin-top:20px;text-align:left"><div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:8px;">間違えた単語 (${state.typingWrong.length}語)</div>${wrongList}</div>` : ''}

// ═══════════════════════════════════════
// 🔁 REVIEW MODE
// ═══════════════════════════════════════
// 復習セッション終了時のまとめ（今回のキューの単語が今どの状態か）
function reviewSummaryHtml() {
  const q = state.reviewQueue || [];
  const cnt = { mastered: 0, recovering: 0, review: 0 };
  q.forEach(w => { const st = statusOf(w.no); if (cnt[st] !== undefined) cnt[st]++; });
  return `<div class="score-label">今回 ${q.length}語 → ${stDot('mastered')}克服済み ${cnt.mastered} ／ ${stDot('recovering')}克服中 ${cnt.recovering} ／ ${stDot('review')}要復習 ${cnt.review}</div>
      <div class="score-label" style="margin-top:4px">復習リストに残り: ${reviewPoolSize()}語</div>`;
}
function renderReview() {
  const sec = document.getElementById('section-review');
  const sc = statusCounts();
  const nMark = Object.keys(markRec).length;
  if (!sc.ever && !nMark) {
    sec.innerHTML = `<div class="empty">
      <div style="font-size:48px;margin-bottom:16px;">🎉</div>
      <div style="font-size:18px;font-weight:800;margin-bottom:8px;">復習が必要な単語はありません！</div>
      <div>テストやタイピングで間違えた単語や、学習ページでマークした単語がここに表示されます。</div>
    </div>`;
    return;
  }
  const poolN = reviewPoolSize();
  const allThree = ['review', 'recovering', 'mastered'].every(k => reviewSel.has(k));
  const chip = (k, label, n, on) => `<button type="button" class="filter-btn${on ? ' active' : ''}" aria-pressed="${on}" onclick="toggleReviewSel('${k}')">${label} (${n})</button>`;
  const chips = [
    chip('ever', '過去に間違えた', sc.ever, allThree),
    chip('review', `${stDot('review')}要復習`, sc.review, reviewSel.has('review')),
    chip('recovering', `${stDot('recovering')}克服中`, sc.recovering, reviewSel.has('recovering')),
    chip('mastered', `${stDot('mastered')}克服済み`, sc.mastered, reviewSel.has('mastered')),
    chip('marked', `<span class="chip-star">${icon('star')}</span>マーク`, nMark, reviewSel.has('marked')),
  ].join('');
  let notice = '';
  if (!reviewSel.size) notice = '出題する分類を1つ以上選んでください。';
  else if (!poolN) notice = sc.mastered && !reviewSel.has('mastered')
    ? '復習が必要な単語はありません。「克服済み」も選ぶと、克服済みの単語を復習できます。'
    : '選んだ分類に、該当する単語がありません。';
  const modeButtons = ['test','typing'].map(m => {
    const labels = {test:'4択テスト', typing:'タイピング'};
    const icons = {test: icon('test'), typing: icon('typing')};
    const active = state.reviewMode === m ? 'active' : '';
    return `<button class="mode-option ${active}" onclick="setReviewMode('${m}')"><span class="mode-icon">${icons[m]}</span>${labels[m]}</button>`;
  }).join('');
  sec.innerHTML = `<h2 style="font-size:18px;font-weight:800;margin-bottom:14px;"><span class="h-ico">${icon('review')}</span>復習モード</h2>
    <div class="data-section" style="margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;">出題する単語（複数選べます）</div>
      <div class="rv-chips">${chips}</div>
      <div class="rv-count">出題: <b>${poolN}語</b></div>
      ${notice ? `<div class="rv-notice">${notice}</div>` : ''}
      <div class="rv-explain" style="font-size:12px;color:var(--muted);line-height:1.6;">
        連続 <b>${masteryN}回</b> 正解すると${stDot('mastered')}克服済みになります。克服済みの単語を間違えると、${stDot('review')}要復習に戻ります。マークした単語は、マークを外すまで対象に残ります。
      </div>
    </div>
    <div style="margin-bottom:16px;">
      <div style="font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px;">出題形式</div>
      <div class="mode-grid">${modeButtons}</div>
    </div>
    <button class="btn-primary" onclick="startReview()" ${poolN ? '' : 'disabled'}>復習開始</button>`;
}
window.toggleReviewSel = function(k) {
  if (k === 'ever') {      // 「過去に間違えた」＝ 要復習・克服中・克服済みをまとめて切り替える
    const keys = ['review', 'recovering', 'mastered'];
    if (keys.every(x => reviewSel.has(x))) keys.forEach(x => reviewSel.delete(x)); else keys.forEach(x => reviewSel.add(x));
  } else if (reviewSel.has(k)) reviewSel.delete(k); else reviewSel.add(k);
  saveReviewSel();
  renderReview();
};
window.setReviewMode = function(m) { state.reviewMode = m; renderReview(); };

window.startReview = function() {
  const wrongWords = reviewPoolWords();
  if (wrongWords.length < (state.reviewMode==='test' ? 4 : 1)) {
    alert(state.reviewMode==='test' ? '復習する単語が4語以上必要です' : '復習する単語がありません');
    return;
  }
  // 要復習を先に、続けてそれ以外（克服中・克服済み・マークのみ）。それぞれシャッフル
  state.reviewQueue = [...shuffle(wrongWords.filter(w => statusOf(w.no) === 'review')), ...shuffle(wrongWords.filter(w => statusOf(w.no) !== 'review'))];
  state.reviewQIdx = 0; state.reviewAnswered = false;
  const RLAB = { review: '要復習', recovering: '克服中', mastered: '克服済み', marked: 'マーク' };
  beginSession('review', REVIEW_SEL_KEYS.filter(k => reviewSel.has(k)).map(k => RLAB[k]).join('＋'));
  if (state.reviewMode === 'test') renderReviewTestQ();
  else renderReviewTypingQ();
};

function renderReviewTestQ() {
  window.__qStart = Date.now();      // 解答時間の計測の開始
  const sec = document.getElementById('section-review');
  const wrongWords = reviewPoolWords();
  if (state.reviewQIdx >= state.reviewQueue.length) {
    const remaining = reviewPoolWords();
    endSession('review');
    sec.innerHTML = `<div class="score-card">
      <div style="font-size:48px;margin-bottom:12px;">✅</div>
      <div class="big-score" style="font-size:36px;">セッション終了</div>
      ${reviewSummaryHtml()}
      <div class="btn-row" style="justify-content:center">
        <button class="btn-secondary" onclick="startReview()">続ける</button>
        <button class="btn-secondary" onclick="renderReview()">戻る</button>
      </div>
    </div>`;
    return;
  }
  const cur = state.reviewQueue[state.reviewQIdx];
  const pool = reviewPoolWords();
  const safePool = pool.length >= 4 ? pool : [...pool, ...WORDS.filter(w=>!inReviewPool(w.no))].slice(0,20);
  const correctMeaning = randMeaning(cur);
  const choices = getChoices(cur, safePool, correctMeaning);
  const total = state.reviewQueue.length;
  const pct = Math.round(state.reviewQIdx / total * 100);

  const choiceContent = choices.map((c, i) => {
    const m = (c.no === cur.no) ? correctMeaning : randMeaning(c);
    return `<button class="choice-btn" onclick="answerReviewTest(${c.no},${cur.no})" data-no="${c.no}"><span class="choice-key">${i+1}</span>${escHtml(m)}</button>`;
  }).join('');

  sec.innerHTML = `<div class="quiz-card"><button type="button" class="quiz-quit" onclick="quitQuiz()">中断</button>
    <div class="quiz-progress">${state.reviewQIdx+1} / ${total} &nbsp;|&nbsp; 復習リスト: ${wrongWords.length}語</div>
    <div class="quiz-progress-bar"><div class="quiz-progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="quiz-type-label">復習 — 英語 → 日本語</div>
    <div class="quiz-question">${escHtml(cur.word)}</div>
    <div class="choices">${choiceContent}</div>
    <div id="review-result"></div>
  </div>`;
}

window.answerReviewTest = function(selectedNo, correctNo) {
  if (state.reviewAnswered) return;
  state.reviewAnswered = true;
  const isCorrect = selectedNo === correctNo;
  const cur = WORDS.find(w => w.no === correctNo);
  document.querySelectorAll('#section-review .choice-btn').forEach(btn => {
    btn.disabled = true;
    const no = parseInt(btn.dataset.no);
    if (no === correctNo) btn.classList.add('correct');
    else if (no === selectedNo && !isCorrect) btn.classList.add('wrong');
  });
  if (isCorrect) markCorrect(correctNo);
  else markWrong(correctNo);
  const allMeanings = cur.meanings.map(m=>escHtml(m)).join(' / ');
  const resClass = isCorrect ? 'ok' : 'ng';
  const icon = isCorrect ? '⭕' : '❌';
  document.getElementById('review-result').innerHTML = `
    <div class="result-box ${resClass}">
      ${markBtnHtml(cur.no)}
      <div class="result-icon">${icon}</div>
      <div class="result-word">${escHtml(cur.word)}</div>
      ${pronHtml(cur.word)}
      <div class="result-meanings">${allMeanings}</div>
      ${statusLineHtml(cur.no, isCorrect)}
    </div>
    <button class="next-btn" onclick="nextReviewTest()">次へ →</button>`;
  scrollResultIntoView('review-result');
};

window.nextReviewTest = function() {
  window.scrollTo({ top: 0 });
  // 正解してwrongSetから既に外れた単語は、このセッションの残りキュー（現在位置より後ろ）
  // からも取り除く。こうしないと「間違いリストから削除されました」と表示された単語が
  // 同じセッション内で再び出題されてしまう。
  const justAnswered = state.reviewQueue[state.reviewQIdx];
  if (justAnswered && !wrongSet.has(justAnswered.no)) {
    state.reviewQueue = state.reviewQueue.filter((w, i) => i <= state.reviewQIdx || w.no !== justAnswered.no);
  }
  state.reviewQIdx++; state.reviewAnswered = false;
  renderReviewTestQ();
};

function renderReviewTypingQ() {
  window.__qStart = Date.now();      // 解答時間の計測の開始
  const sec = document.getElementById('section-review');
  if (state.reviewQIdx >= state.reviewQueue.length) {
    const remaining = reviewPoolWords();
    endSession('review');
    sec.innerHTML = `<div class="score-card">
      <div style="font-size:48px;margin-bottom:12px;">✅</div>
      <div class="big-score" style="font-size:36px;">セッション終了</div>
      ${reviewSummaryHtml()}
      <div class="btn-row" style="justify-content:center">
        <button class="btn-secondary" onclick="startReview()">続ける</button>
        <button class="btn-secondary" onclick="renderReview()">戻る</button>
      </div>
    </div>`;
    return;
  }
  const wrongWords = reviewPoolWords();
  const cur = state.reviewQueue[state.reviewQIdx];
  const total = state.reviewQueue.length;
  const pct = Math.round(state.reviewQIdx / total * 100);
  const qMeaning = randMeaning(cur);
  sec.innerHTML = `<div class="quiz-card"><button type="button" class="quiz-quit" onclick="quitQuiz()">中断</button>
    <div class="quiz-progress">${state.reviewQIdx+1} / ${total} &nbsp;|&nbsp; 復習リスト: ${wrongWords.length}語</div>
    <div class="quiz-progress-bar"><div class="quiz-progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="quiz-type-label">復習 — タイピング</div>
    <div class="quiz-question">${escHtml(qMeaning)}</div>
    <div class="typing-input-row">
      <input type="text" id="review-typing-input" placeholder="英単語を入力..." autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')submitReviewTyping()">
      <button class="submit-btn" onclick="submitReviewTyping()">確認</button>
    </div>
    <div id="review-typing-result"></div>
  </div>`;
  setTimeout(() => { const inp = document.getElementById('review-typing-input'); if(inp) inp.focus(); }, 100);
}

window.submitReviewTyping = function() {
  if (state.reviewAnswered) return;
  const cur = state.reviewQueue[state.reviewQIdx];
  const inp = document.getElementById('review-typing-input');
  if (!inp) return;
  const val = normalizeTypingInput(inp.value);
  if (!val) return;
  state.reviewAnswered = true;
  inp.disabled = true;
  inp.blur(); // フォーカスを外してEnter/Spaceで次へ進めるようにする
  const isCorrect = isTypingMatch(val, cur.word);
  if (isCorrect) markCorrect(cur.no);
  else markWrong(cur.no);
  const allMeanings = cur.meanings.map(m=>escHtml(m)).join(' / ');
  const resClass = isCorrect ? 'ok' : 'ng';
  const icon = isCorrect ? '⭕' : '❌';
  document.getElementById('review-typing-result').innerHTML = `
    <div class="result-box ${resClass}">
      ${markBtnHtml(cur.no)}
      <div class="result-icon">${icon}</div>
      <div class="result-word">${escHtml(cur.word)}</div>
      ${pronHtml(cur.word)}
      <div class="result-meanings">${allMeanings}</div>
      ${statusLineHtml(cur.no, isCorrect)}
    </div>
    <button class="next-btn" onclick="nextReviewTyping()">次へ →</button>`;
  scrollResultIntoView('review-typing-result');
};

window.nextReviewTyping = function() {
  window.scrollTo({ top: 0 });
  // テスト形式の復習と同様、正解済みの単語は残りキューから取り除く。
  const justAnswered = state.reviewQueue[state.reviewQIdx];
  if (justAnswered && !wrongSet.has(justAnswered.no)) {
    state.reviewQueue = state.reviewQueue.filter((w, i) => i <= state.reviewQIdx || w.no !== justAnswered.no);
  }
  state.reviewQIdx++; state.reviewAnswered = false;
  renderReviewTypingQ();
};

// ═══════════════════════════════════════
// 📋 WORD LIST
// ═══════════════════════════════════════
// 一覧の絞り込み結果（件数 + テーブル本体）だけを組み立てる。
// 検索入力のたびに全体を再描画すると入力欄が作り直されてフォーカス・キーボードが
// 失われる（特にスマホで致命的）ため、入力欄は再生成せずこの部分だけ差し替える。
function buildWordListBody() {
  const listFilter = state.listFilter || 'all';
  const searchVal = state.listSearch || '';
  let words = WORDS;
  if (listFilter !== 'all') words = WORDS.filter(w => { if (listFilter === 'marked') return !!markRec[w.no]; const st = statusOf(w.no); return listFilter === 'ever' ? st !== 'none' : st === listFilter; });
  if (searchVal) {
    const q = searchVal.toLowerCase();
    words = words.filter(w => w.word.toLowerCase().includes(q) || w.meanings.some(m => m.includes(q)));
  }
  if (state.listSort === 'miss') words = [...words].sort((a, b) => missCountOf(b.no) - missCountOf(a.no) || a.no - b.no);
  const rows = words.map(w => {
    const wrongBadge = statusBadgeHtml(w.no);
    return `<tr>
      <td class="td-no">${w.no}</td>
      <td class="td-word">${escHtml(w.word)}${markBtnHtml(w.no, 'sm')}</td>
      <td class="td-meaning">${w.meanings.map(m=>escHtml(m)).join(' / ')}</td>
      <td class="td-status">${wrongBadge}</td>
    </tr>`;
  }).join('');
  return `<div class="list-count" style="font-size:13px;color:var(--muted);margin-bottom:8px;">${words.length}語表示</div>
    <div class="scroll-list">
      <table class="word-table">
        <thead><tr><th>No.</th><th>単語</th><th>意味</th><th class="th-status">復習状況</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" style="text-align:center;padding:24px;color:var(--muted)">該当する単語がありません</td></tr>'}</tbody>
      </table>
    </div>`;
}

// スマホでは、一覧のスクロール領域の下端を下部ナビの直上に合わせる。
// 絞り込みボタンの段数などで上の高さが変わるため、固定値ではなく実測で決める。
function fitScrollList() {
  const el = document.querySelector('#list-body .scroll-list');
  if (!el) return;
  const nav = document.getElementById('nav');
  const topDoc = el.getBoundingClientRect().top + window.scrollY;
  const fixedNav = isMobile() && nav && getComputedStyle(nav).position === 'fixed';
  const bottomLimit = fixedNav ? nav.getBoundingClientRect().top : window.innerHeight;
  const avail = bottomLimit - topDoc - 24;   // 24 = ページ下余白。これでページ全体が余分にスクロールしない
  el.style.maxHeight = Math.max(160, Math.floor(avail)) + 'px';
}
window.addEventListener('resize', () => { if (state && state.section === 'wordlist') fitScrollList(); });
function renderWordList() {
  const sec = document.getElementById('section-wordlist');
  const listFilter = state.listFilter || 'all';
  const searchVal = state.listSearch || '';

  const sc = statusCounts();
  const filterBtns = [
    {k:'all', label:'すべて'},
    {k:'ever', label:`過去に間違えた (${sc.ever})`},
    {k:'review', label:`${stDot('review')}要復習 (${sc.review})`},
    {k:'recovering', label:`${stDot('recovering')}克服中 (${sc.recovering})`},
    {k:'mastered', label:`${stDot('mastered')}克服済み (${sc.mastered})`},
    {k:'marked', label:`${icon('star')}マーク済み (${Object.keys(markRec).length})`},
  ].map(f => `<button class="filter-btn ${listFilter===f.k?'active':''}" data-k="${f.k}" onclick="setListFilter('${f.k}')">${f.label}</button>`).join('')
    + `<button class="filter-btn ${state.listSort==='miss'?'active':''}" onclick="toggleListSort()">✕回数順</button>`;

  sec.innerHTML = `<h2 style="font-size:18px;font-weight:800;margin-bottom:14px;"><span class="h-ico">${icon('wordlist')}</span>単語一覧</h2>
    <div class="list-filters">${filterBtns}</div>
    <input type="text" id="list-search-input" placeholder="単語・意味で検索..." value="${escHtml(searchVal)}" oninput="listSearch(this.value)" style="margin-bottom:12px">
    <div id="list-body">${buildWordListBody()}</div>`;
  window.scrollTo(0, 0);
  fitScrollList();
  setTimeout(fitScrollList, 250);   // フォント読み込み後などの高さ変化に備える
}
window.setListFilter = function(f) { state.listFilter = f; renderWordList(); };
window.toggleListSort = function() { state.listSort = state.listSort === 'miss' ? 'no' : 'miss'; renderWordList(); };
window.listSearch = function(v) {
  state.listSearch = v;
  const body = document.getElementById('list-body');
  if (body) { body.innerHTML = buildWordListBody(); fitScrollList(); }
  else renderWordList();
};

// ⚙ SETTINGS
// ═══════════════════════════════════════
function renderSettings() {
  const sec = document.getElementById('section-settings');
  const sc = statusCounts();
  // history（単語ごとの正解数/回答数）を集計して全体の正答率を出す。
  // これまでhistoryは記録されるだけで一切表示に使われていなかったため、ここで活用する。
  let totalAnswered = 0, totalCorrect = 0, attemptedWords = 0;
  for (const no in history) {
    const h = history[no];
    if (h && h.total > 0) {
      attemptedWords++;
      totalAnswered += h.total;
      totalCorrect += h.correct;
    }
  }
  const accuracyPct = totalAnswered > 0 ? Math.round(totalCorrect / totalAnswered * 100) : null;
  const none = attemptedWords === 0;
  const tile = (v, l, sub) => `<div class="stat-tile"><div class="v">${v}</div><div class="l">${l}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
  const stTile = (st, l, n) => `<div class="stat-tile st"><div class="v">${n}<small>語</small></div><div class="l">${stDot(st)}${l}</div></div>`;
  const nm = escHtml(activeSlotName());
  sec.innerHTML = `<h2 style="font-size:18px;font-weight:800;margin-bottom:16px;"><span class="h-ico">${icon('settings')}</span>設定・データ管理</h2>

    ${slotsSectionHtml()}

    ${syncCardHtml()}

    <div class="set-card">
      <div class="set-head"><span class="set-ico">${icon('chart')}</span><h3>学習状況</h3><span class="slot-sub-name">${nm}</span></div>
      <div class="stat-tiles">
        ${tile(WORDS.length.toLocaleString(), '総単語数')}
        ${tile(attemptedWords.toLocaleString(), '解答した単語')}
        ${tile(Math.max(0, attemptedWords - sc.ever).toLocaleString(), '一度も間違えていない')}
        ${tile(accuracyPct !== null ? accuracyPct + '<small>%</small>' : '—', '正答率', accuracyPct !== null ? `${totalCorrect} / ${totalAnswered}回` : 'まだ記録なし')}
      </div>
      <div class="stat-tiles four">
        ${stTile('review', '要復習', sc.review)}
        ${stTile('recovering', '克服中', sc.recovering)}
        ${stTile('mastered', '克服済み', sc.mastered)}
        <div class="stat-tile st"><div class="v">${Object.keys(markRec).length}<small>語</small></div><div class="l"><span class="li-star">${icon('star')}</span>マーク</div></div>
      </div>
    </div>

window.exportData = function() {
  const data = {
    version: 3,
    slotName: activeSlotName(),
    exportedAt: new Date().toISOString(),
    wrongList: [...wrongSet],     // 旧バージョンとの互換用（復習キュー）
    history: history,
    missRecords: missRec,         // 間違えた回数・連続正解数・最後に間違えた時刻
    marks: markRec,               // 自分でつけたマーク（番号 → マークした時刻）
    studyPos: studyPos,           // 学習ページで最後に見ていた単語と範囲
    daily: dailyRec,              // 日ごとの記録（端末別）
    sessions: sessionRec,         // テスト・タイピング・復習の結果の履歴
    wstat: wstatRec,              // 単語ごとの追加情報（平均解答時間など）
    masteryN: masteryN,
    ranges: currentRanges(),
    lastAnswerAt: lastAnswerAt,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'leap_data_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
};

// インポートは「新しいセーブデータとして追加」する（今のセーブデータは上書きしない）
window.importData = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (slotIndex.order.length >= MAX_SLOTS) throw new Error(`セーブデータが上限(${MAX_SLOTS}個)です。先に不要なものを削除してください`);
      const hist = (data.history && typeof data.history === 'object') ? data.history : {};
      // 新形式(missRecords)があればそのまま、旧形式(wrongList+history)なら移行して取り込む
      const miss = data.missRecords ? data.missRecords : migrateLegacy(data.wrongList, hist);
      const d = { v: 1, history: hist, missRec: miss, marks: sanitizeMarks(data.marks), studyPos: sanitizeStudyPos(data.studyPos), daily: sanitizeDaily(data.daily), sessions: sanitizeSessions(data.sessions), wstat: sanitizeWstat(data.wstat), masteryN: MASTERY_OPTIONS.includes(data.masteryN) ? data.masteryN : 3,
                  ranges: data.ranges || null, lastAnswerAt: data.lastAnswerAt || 0 };
      const name = String(data.slotName || ('インポート ' + new Date().toISOString().slice(0, 10))).slice(0, SLOT_NAME_MAX);
      const id = createSlot(name, d);
      if (!id) return;
      switchSlot(id);
      const sc = statusCounts();
      alert(`インポート完了！「${name}」として追加しました。\n要復習 ${sc.review}語 / 克服中 ${sc.recovering}語 / 克服済み ${sc.mastered}語`);
    } catch(err) {
      alert('インポートに失敗しました: ' + err.message);
    }
  };
  reader.readAsText(file);
  input.value = '';
};

window.setMasteryN = function(n) {
  if (!MASTERY_OPTIONS.includes(n)) return;
  masteryN = n; masteryAt = Date.now();
  recomputeWrongSet();   // 条件が変わると復習キューの中身も変わる
  saveStorage();
  renderSection('settings');   // 設定画面と上部バーの両方を更新
};

// 復習リストを空にする: 要復習・克服中を克服済み扱いにする（✕の履歴は残す）
window.clearReviewQueue = function() {
  if (!confirm('復習リストを空にしますか？\n（要復習・克服中の単語は克服済み扱いになります。間違えた履歴✕は残ります）')) return;
  for (const k in missRec) { if (missRec[k].n > 0 && missRec[k].s < masteryN) { missRec[k].s = LEGACY_STREAK; touch(k); } }

  alert('復習リストを空にしました');
  renderSection('settings');
};

window.resetMissHistory = function() {
  if (!confirm('間違えた履歴（✕の回数・状態）をすべて消しますか？この操作は取り消せません。')) return;

window.clearMarks = function() {
  if (!Object.keys(markRec).length) { alert('マークはありません'); return; }

window.resetAll = function() {
  if (!confirm(`セーブデータ「${activeSlotName()}」の記録（解答履歴・間違えた履歴・マーク・学習位置）をすべて消しますか？\nこの操作は取り消せません。`)) return;
