// ───────────────────────────────────────────
// デバイス間の同期（GitHubの非公開リポジトリ）
//  ・リポジトリの leap-sync/ に JSON を保存する: index.json（セーブデータの一覧）と slot-<id>.json（各セーブデータ）
//  ・単語ごとに「更新時刻 upd が新しい方」を残して合わせる（記録が上書きで消えない）
//  ・リポジトリ名とトークンは、この端末のブラウザ(localStorage)にだけ保存する。HTMLには埋め込まない
// ───────────────────────────────────────────
const SYNC_CFG_KEY = 'leap_sync_cfg';
const SYNC_BACKUP_KEY = 'leap_sync_backup';
const SYNC_DIR = 'leap-sync';
let syncCfg = null;
try { const c = JSON.parse(localStorage.getItem(SYNC_CFG_KEY)); if (c && c.repo && c.token) syncCfg = c; } catch (e) {}
let syncState = { status: syncCfg ? 'idle' : 'off', last: 0, msg: '' };
let syncRunning = false, syncQueuedMode = null, syncTimer = null, syncDirty = false, syncWantAll = false;

function saveSyncCfg(c) {
  try { if (c) localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_CFG_KEY); } catch (e) {}
  syncCfg = c;
}
function b64enc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function syncErr(status, msg) { const e = new Error(msg || ('HTTP ' + status)); e.status = status; return e; }
function syncErrText(e) {
  if (e && e.status === 401) return 'トークンが無効か、期限切れです（連携を解除して設定し直してください）';
  if (e && e.status === 403) return '権限がない、またはAPIの利用制限です';
  if (e && e.status === 404) return 'リポジトリが見つかりません（名前とトークンの権限を確認してください）';
  if (e instanceof TypeError) return '通信できませんでした。つながったら自動で再試行します';
  return '同期に失敗しました（' + ((e && e.message) || e) + '）';
}
async function ghFetch(path, opt) {
  const o = Object.assign({}, opt);
  o.cache = 'no-store';
  o.headers = Object.assign({
    'Authorization': 'Bearer ' + syncCfg.token,
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
  }, o.headers || {});
  return fetch('https://api.github.com/repos/' + syncCfg.repo + path, o);
}
async function ghGetJson(path) {
  const r = await ghFetch('/contents/' + path);
  if (r.status === 404) return null;
  if (!r.ok) throw syncErr(r.status);
  const j = await r.json();
  if (!j.content) throw syncErr(0, 'ファイルが大きすぎて読み込めません');
  return { sha: j.sha, data: JSON.parse(b64dec(j.content)) };
}
async function ghPutJson(path, obj, sha) {
  const body = { message: 'sync ' + new Date().toISOString(), content: b64enc(JSON.stringify(obj)) };
  if (sha) body.sha = sha;
  const r = await ghFetch('/contents/' + path, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) { const e = syncErr(r.status, '他の端末と同時に更新されました'); e.conflict = true; throw e; }
  if (!r.ok) throw syncErr(r.status);
}

// ---- 記録の統合（単語ごとに、更新時刻が新しい方を残す） ----
function normSync(d) {
  d = d || {};
  const o = {
    history: (d.history && typeof d.history === 'object') ? d.history : {},
    missRec: (d.missRec && typeof d.missRec === 'object') ? d.missRec : {},
    marks: sanitizeMarks(d.marks), upd: {},
    masteryN: MASTERY_OPTIONS.includes(d.masteryN) ? d.masteryN : 3,
    masteryAt: d.masteryAt || 0, lastAnswerAt: d.lastAnswerAt || 0, studyPos: sanitizeStudyPos(d.studyPos),
    daily: sanitizeDaily(d.daily), sessions: sanitizeSessions(d.sessions), wstat: sanitizeWstat(d.wstat),
  };
  const u = sanitizeUpd(d.upd);
  const nos = new Set([...Object.keys(o.history), ...Object.keys(o.missRec), ...Object.keys(o.marks), ...Object.keys(o.wstat), ...Object.keys(u)]);
  // upd が無い古い記録は、最後に間違えた時刻やマークの時刻で代用する（最低でも1。無記録の0より新しい扱い）
  nos.forEach(k => { o.upd[k] = u[k] > 0 ? u[k] : Math.max((o.missRec[k] && o.missRec[k].t) || 0, o.marks[k] || 0, 1); });
  return o;
}
function mergeSync(a, b) {      // a: この端末  b: リモート
  const m = { history: {}, missRec: {}, marks: {}, wstat: {}, upd: {}, pull: 0, push: 0 };
  const rec = (d, k) => JSON.stringify([d.history[k] || null, d.missRec[k] || null, d.marks[k] || null, d.wstat[k] || null]);
  const tie = k => {
    const th = x => (x.history[k] && x.history[k].total) || 0, tn = x => (x.missRec[k] && x.missRec[k].n) || 0;
    if (th(a) !== th(b)) return th(a) > th(b) ? 'a' : 'b';
    if (tn(a) !== tn(b)) return tn(a) > tn(b) ? 'a' : 'b';
    return 'a';
  };
  new Set([...Object.keys(a.upd), ...Object.keys(b.upd)]).forEach(k => {
    const ta = a.upd[k] || 0, tb = b.upd[k] || 0, same = rec(a, k) === rec(b, k);
    let src = 'a';
    if (tb > ta) src = 'b'; else if (ta === tb && !same) src = tie(k);
    if (!same) { if (src === 'b') m.pull++; else m.push++; }
    const s = src === 'b' ? b : a;
    if (s.history[k]) m.history[k] = s.history[k];
    if (s.missRec[k]) m.missRec[k] = s.missRec[k];
    if (s.marks[k]) m.marks[k] = s.marks[k];
    if (s.wstat[k]) m.wstat[k] = s.wstat[k];
    m.upd[k] = Math.max(ta, tb);
  });
  // 日ごとの記録：日付×端末ごとに、数字が大きい方（増えるだけの数字なので、大きい方が新しい）
  const dsum = o => (o.a || 0) + (o.c || 0) + (o.v || 0) + (o.ts || 0) + (o.tq || 0);
  m.daily = {};
  new Set([...Object.keys(a.daily), ...Object.keys(b.daily)]).forEach(dt => {
    const A = a.daily[dt] || {}, B = b.daily[dt] || {}, out = {};
    new Set([...Object.keys(A), ...Object.keys(B)]).forEach(dev => {
      const x = A[dev], y = B[dev];
      if (x && y) { if (dsum(y) > dsum(x)) { out[dev] = y; m.pull++; } else { out[dev] = x; if (dsum(x) > dsum(y)) m.push++; } }
      else if (x) { out[dev] = x; m.push++; } else { out[dev] = y; m.pull++; }
    });
    m.daily[dt] = out;
  });
  // テスト等の結果の履歴：idが同じものは同じ記録として、両方をあわせる（新しい300件）
  const aIds = new Set(a.sessions.map(x => x.id)), bIds = new Set(b.sessions.map(x => x.id));
  const sm = new Map(); a.sessions.forEach(x => sm.set(x.id, x)); b.sessions.forEach(x => { if (!sm.has(x.id)) sm.set(x.id, x); });
  m.sessions = [...sm.values()].sort((x, y) => x.at - y.at).slice(-300);
  if (m.sessions.some(x => !aIds.has(x.id))) m.pull++;
  if (m.sessions.some(x => !bIds.has(x.id))) m.push++;
  // 克服の条件（連続正解数）は、変更した時刻が新しい方
  if (b.masteryAt > a.masteryAt) { m.masteryN = b.masteryN; m.masteryAt = b.masteryAt; if (a.masteryN !== b.masteryN) m.pull++; }
  else { m.masteryN = a.masteryN; m.masteryAt = a.masteryAt; if (a.masteryAt > b.masteryAt && a.masteryN !== b.masteryN) m.push++; }
  // 学習位置は、記録した時刻が新しい方
  if (b.studyPos.at > a.studyPos.at) { m.studyPos = b.studyPos; m.pull++; }
  else { m.studyPos = a.studyPos; if (a.studyPos.at > b.studyPos.at) m.push++; }
  m.lastAnswerAt = Math.max(a.lastAnswerAt, b.lastAnswerAt);
  return m;
}
function syncPayload(m) {
  return { v: 1, history: m.history, missRec: m.missRec, marks: m.marks, upd: m.upd, studyPos: m.studyPos, daily: m.daily, sessions: m.sessions, wstat: m.wstat, masteryN: m.masteryN, masteryAt: m.masteryAt, lastAnswerAt: m.lastAnswerAt, savedAt: Date.now() };
}
function isFreshSlot(id) {
  const d = id === slotIndex.active ? currentSlotData() : (readSlotData(id) || {});
  // 「まだ何も解いていない」セーブデータか。学習ページで単語を見ただけ（見た数・時間・位置）は、記録とは数えない
  const answered = Object.values(d.daily || {}).some(day => Object.values(day || {}).some(r => r && r.a > 0));
  return !Object.keys(d.history || {}).length && !Object.keys(d.missRec || {}).length &&
         !Object.keys(sanitizeMarks(d.marks)).length && !answered && !((d.sessions || []).length) && !(d.lastAnswerAt > 0);
}
function syncBackupSlot(run, id, raw) {
  if (!run.backup) run.backup = { at: Date.now(), slots: {} };
  if (!run.backup.slots[id]) run.backup.slots[id] = JSON.parse(JSON.stringify(raw || {}));
}
function applyMerged(id, m, run) {
  if (id === slotIndex.active) {
    history = m.history; missRec = m.missRec; markRec = m.marks; updRec = m.upd;
    dailyRec = m.daily; sessionRec = m.sessions; wstatRec = m.wstat;
    masteryN = m.masteryN; masteryAt = m.masteryAt; lastAnswerAt = m.lastAnswerAt;
    const prevPosAt = studyPos.at;
    studyPos = m.studyPos;
    // 他の端末の方が新しい位置で、この端末でまだ単語を動かしていなければ、その位置に合わせる
    if (m.studyPos.at > prevPosAt && !studyNavigated && m.studyPos.no) restoreStudyPos();
    recomputeWrongSet();
    writeSlotData(id, currentSlotData());
    run.pulledActive = true;
  } else {
    const cur = readSlotData(id) || {};
    writeSlotData(id, Object.assign({}, cur, { v: 1, history: m.history, missRec: m.missRec, marks: m.marks, upd: m.upd, studyPos: m.studyPos,
      daily: m.daily, sessions: m.sessions, wstat: m.wstat, masteryN: m.masteryN, masteryAt: m.masteryAt, lastAnswerAt: m.lastAnswerAt }));
  }
  run.pulledAny = true;
}
async function syncSlot(id, run) {
  const path = SYNC_DIR + '/slot-' + id + '.json';
  for (let attempt = 0; attempt < 3; attempt++) {
    const remote = await ghGetJson(path);
    // ↓ 取得してから反映までは await を挟まない（待っている間の操作を取りこぼさないため）
    const raw = id === slotIndex.active ? currentSlotData() : readSlotData(id);
    if (!raw) return;
    const m = mergeSync(normSync(raw), normSync(remote ? remote.data : null));
    if (m.pull > 0 || !raw.upd) { syncBackupSlot(run, id, raw); applyMerged(id, m, run); }
    // ↑ ここまで
    if (!remote || m.push > 0) {
      try { await ghPutJson(path, syncPayload(m), remote ? remote.sha : undefined); }
      catch (e) { if (e.conflict && attempt < 2) continue; throw e; }
    }
    return;
  }
}

// ---- セーブデータの一覧（名前・削除）の統合 ----
function removeLocalSlot(id, run) {
  try { localStorage.removeItem(slotKey(id)); } catch (e) {}
  delete slotIndex.meta[id];
  slotIndex.order = slotIndex.order.filter(x => x !== id);
  run.structural = true;
}
function mergeIndex(remoteIdx, run) {
  const L = slotIndex;
  const R = remoteIdx || { order: [], slots: {}, deleted: {} };
  const rsl = R.slots || {}, rdel = R.deleted || {};
  const del = Object.assign({}, rdel);
  for (const k in (L.deleted || {})) del[k] = Math.max(del[k] || 0, L.deleted[k]);
  L.deleted = del;
  let push = !remoteIdx;
  // 初回起動の空のセーブデータは、リモートにある記録に置き換える（空のデータが増えないように）
  const liveRemote = Object.keys(rsl).filter(id => !del[id]);
  if (L.order.length === 1 && liveRemote.length && !rsl[L.order[0]] && isFreshSlot(L.order[0])) {
    const fid = L.order[0];
    try { localStorage.removeItem(slotKey(fid)); } catch (e) {}
    delete L.meta[fid]; L.order = []; run.structural = true;
  }
  const slots = {};
  new Set([...Object.keys(L.meta), ...Object.keys(rsl)]).forEach(id => {
    if (del[id]) { if (L.meta[id]) removeLocalSlot(id, run); return; }
    const lm = L.meta[id], rm = rsl[id];
    if (lm && rm) {
      const lt = lm.nameAt || lm.createdAt || 0, rt = rm.nameAt || rm.createdAt || 0;
      if (rt > lt) { lm.name = rm.name; lm.nameAt = rt; run.structural = true; } else if (lt > rt) push = true;
    } else if (lm) {
      push = true;
    } else {
      L.meta[id] = { name: rm.name, createdAt: rm.createdAt || Date.now(), nameAt: rm.nameAt || 0 };
      L.order.push(id);
      writeSlotData(id, { v: 1, history: {}, missRec: {}, marks: {}, upd: {}, masteryN: 3, masteryAt: 0, ranges: null, lastAnswerAt: 0 });
      run.structural = true;
    }
    const m = L.meta[id];
    slots[id] = { name: m.name, nameAt: m.nameAt || m.createdAt || 0, createdAt: m.createdAt || 0 };
  });
  if (!L.order.length) {
    const id = newSlotId();
    L.order = [id]; L.meta[id] = { name: 'セーブデータ1', createdAt: Date.now() };
    writeSlotData(id, { v: 1, history: {}, missRec: {}, marks: {}, upd: {}, masteryN: 3, masteryAt: 0, ranges: null, lastAnswerAt: 0 });

}

const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
function dayNum(k) { const [y, m, d] = k.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); }
function recDays(n) {
  const out = [], t = new Date();
  for (let i = n - 1; i >= 0; i--) out.push(dkey(new Date(t.getFullYear(), t.getMonth(), t.getDate() - i)));
  return out;
}
function daySum(k) {
  const o = { a: 0, c: 0, v: 0, ts: 0, tq: 0 }, day = dailyRec[k];
  if (day) for (const dev in day) { const r = day[dev]; o.a += r.a || 0; o.c += r.c || 0; o.v += r.v || 0; o.ts += r.ts || 0; o.tq += r.tq || 0; }

}
function fmtDur(sec) {
  sec = Math.round(sec);
  if (sec < 60) return sec + '秒';
  const m = Math.floor(sec / 60);
  if (m < 60) return m + '分' + String(sec % 60).padStart(2, '0') + '秒';
  return Math.floor(m / 60) + '時間' + String(m % 60).padStart(2, '0') + '分';
}
function fmtDurShort(sec) {
  const m = Math.round(sec / 60);
  return m < 60 ? m + '分' : Math.floor(m / 60) + '時間' + String(m % 60).padStart(2, '0') + '分';
}
function streakInfo() {
  const act = Object.keys(dailyRec).filter(k => { const s = daySum(k); return s.a > 0 || s.v > 0; }).map(dayNum).sort((x, y) => x - y);
  let longest = 0, run = 0, prev = null;
  act.forEach(n => { run = (prev !== null && n === prev + 1) ? run + 1 : 1; longest = Math.max(longest, run); prev = n; });
  const set = new Set(act), today = dayNum(dateKey());
  let cur = 0, d = set.has(today) ? today : today - 1;      // 今日まだ学習していなくても、昨日までの連続は途切れない
  while (set.has(d)) { cur++; d--; }
  return { cur, longest, total: act.length };
}

    const k = dateKey(s.at), d = new Date(s.at), hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    const dl = k === todayK ? '今日' : k === yK ? '昨日' : (d.getMonth() + 1) + '/' + d.getDate();
    return `<div class="rec-sess"><span class="md">${icon(s.mode)}</span><b>${names[s.mode]}</b><span class="sc">${s.c}/${s.n}<small>${Math.round(s.c / s.n * 100)}%</small></span><small>${dl} ${hm} ・ ${escHtml(s.label)} ・ ${fmtDur(s.sec)}</small></div>`;
  }).join('');
  return `<div class="rec-card list"><h3>最近の結果<small>${L.length ? '全' + L.length + '回' : ''}</small></h3>
    <div class="rec-scroll">${rows || '<div class="rec-empty">まだ記録がありません。<br>テスト・タイピング・復習を最後まで解く（または中断する）と、結果がここに残ります。</div>'}</div></div>`;
}

function renderRecord() {
  flushTime();
  const sec = document.getElementById('section-record');
  const tab = state.recTab || 'summary';
  const tabs = [['summary', 'サマリー'], ['trend', '推移'], ['range', '範囲別'], ['history', '履歴']];
  const body = { summary: recSummaryHtml, trend: recTrendHtml, range: recRangeHtml, history: recHistoryHtml }[tab]();
  sec.innerHTML = `<div class="rec-wrap" id="rec-wrap">
    <h2 style="font-size:18px;font-weight:800;"><span class="h-ico">${icon('chart')}</span>記録</h2>
    <div class="seg rec-seg" role="tablist">${tabs.map(([k, l]) => `<button type="button" class="${tab === k ? 'active' : ''}" onclick="setRecTab('${k}')">${l}</button>`).join('')}</div>
    <div class="rec-pane" id="rec-pane">${body}</div></div>`;
  fitRecord();
}
window.setRecTab = function(k) { state.recTab = k; renderRecord(); };
window.setRecSpan = function(n) { state.recSpan = n; renderRecord(); };
window.setRecRank = function(m) { state.recRank = m; renderRecord(); };
// ページ全体がスクロールしないように、枠の高さを画面に合わせ、入りきらないときは下の項目から隠す
function fitRecord() {
  const wrap = document.getElementById('rec-wrap');
  if (!wrap) return;
  window.scrollTo(0, 0);
  const topV = wrap.getBoundingClientRect().top;
  let h;
  if (isMobile()) {
    const nav = document.getElementById('nav'), navTop = nav ? nav.getBoundingClientRect().top : window.innerHeight;
    const padB = parseFloat(getComputedStyle(document.getElementById('content')).paddingBottom) || 0;
    h = Math.min(navTop - 8, window.innerHeight - padB) - topV;
  } else {
    h = Math.min(window.innerHeight - topV - 24, 760);
  }
  wrap.style.height = Math.max(240, Math.floor(h)) + 'px';
  const pane = document.getElementById('rec-pane');
  measureNoTransition(() => {
    pane.classList.remove('compact');
    pane.querySelectorAll('.opt').forEach(e => { e.style.display = ''; });
    if (pane.scrollHeight > pane.clientHeight + 1) pane.classList.add('compact');
    for (const e of [...pane.querySelectorAll('.opt')].reverse()) {
      if (pane.scrollHeight <= pane.clientHeight + 1) break;
      e.style.display = 'none';
    }
  });
}
window.addEventListener('resize', () => { if (state && state.section === 'record') fitRecord(); });

// ───────────────────────────────────────────
// 学習ページ（スマホ）：左右にスライドして単語を移動する
//  左へスライド＝次の単語 / 右へスライド＝前の単語。指に内容が追従し、離すと次の単語が横から入る。
//  ボタン・入力欄・範囲指定の操作や、縦のスクロールとは区別する。意味が隠れているときも、そのまま単語だけ移動する。
// ───────────────────────────────────────────
(function initStudySwipe() {
  const sec = document.getElementById('section-study');
  if (!sec) return;
  let t = null;       // 進行中のスライド {x, y, at, drag, body}
  const active = () => isMobile() && state.section === 'study' && state.studyTab === 'detail';
  const total = () => getRange(state.studyStart, state.studyEnd).length;
  const canMove = dir => dir > 0 ? state.studyIdx < total() - 1 : state.studyIdx > 0;
  const reset = (body, ms) => {
    body.style.transition = `transform ${ms}ms ease-out, opacity ${ms}ms ease-out`;
    body.style.transform = ''; body.style.opacity = '';
    setTimeout(() => { body.style.transition = ''; body.style.willChange = ''; }, ms + 30);
  };
  sec.addEventListener('touchstart', e => {
    t = null;
    if (!active() || e.touches.length !== 1) return;
    // 下の操作列と範囲指定の欄、入力欄は対象外。内容エリアの中のボタン（発音・意味を隠す・★）の上から始めても、指が動いたらタップにはならないので、スライドとして扱う
    if (e.target.closest('input, textarea, a, .range-bar, .study-nav-row')) return;
    const det = e.target.closest('.study-detail'), body = det && det.querySelector('.study-body');
    if (!body) return;
    const p = e.touches[0];
    t = { x: p.clientX, y: p.clientY, at: Date.now(), drag: false, body };
  }, { passive: true });
  sec.addEventListener('touchmove', e => {
    if (!t || e.touches.length !== 1) return;
    const p = e.touches[0], dx = p.clientX - t.x, dy = p.clientY - t.y;
    if (!t.drag) {
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) { t.drag = true; t.body.style.willChange = 'transform'; }
      else { if (Math.abs(dy) > 12) t = null; return; }       // 縦に動かしたら、スライドとは扱わない
    }
    const dir = dx < 0 ? 1 : -1, mv = dx * (canMove(dir) ? 0.7 : 0.2);      // 端の単語では、動きを重くして「これ以上ない」と伝える
    t.body.style.transition = 'none';
    t.body.style.transform = `translateX(${mv}px)`;
    t.body.style.opacity = String(1 - Math.min(Math.abs(mv) / 320, 0.45));
  }, { passive: true });
  const end = e => {
    if (!t) return;
    const s = t; t = null;
    if (!s.drag) return;
    const p = (e.changedTouches && e.changedTouches[0]) || { clientX: s.x }, dx = p.clientX - s.x, dt = Math.max(1, Date.now() - s.at);
    const dir = dx < 0 ? 1 : -1;
    const go = e.type === 'touchend' && (Math.abs(dx) >= 70 || (Math.abs(dx) >= 35 && Math.abs(dx) / dt > 0.5)) && canMove(dir);   // 距離が十分、または素早いはじき
    if (!go) { reset(s.body, 200); return; }
    s.body.style.transition = 'transform .11s ease-in, opacity .11s ease-in';
    s.body.style.transform = `translateX(${dir > 0 ? -70 : 70}px)`; s.body.style.opacity = '0';
    setTimeout(() => {
      if (!active()) return;
      if (dir > 0) studyNext(); else studyPrev();
      const nb = document.querySelector('#section-study .study-body');
      if (nb && nb.animate) nb.animate([{ transform: `translateX(${dir > 0 ? 60 : -60}px)`, opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }], { duration: 190, easing: 'ease-out' });
    }, 110);
  };
  sec.addEventListener('touchend', end, { passive: true });
  sec.addEventListener('touchcancel', end, { passive: true });
})();

// ── KEYBOARD SHORTCUTS ──
/*
  Study   : →/Space/Enter=意味を表示(隠しモード時)→次へ  ←=前へ  M/↑=マーク
  Quiz    : テスト・タイピング・復習の出題中も M/↑=マーク（タイピング入力中は ↑ のみ）
  Test    : 1-4=選択肢選択(回答前)  Enter/Space=次へ(回答後)
  Typing  : Enter=送信(既存・input内)  Enter/Space=次へ(回答後・input外)
  Review  : テスト/タイピングと同様
*/
document.addEventListener('keydown', function(e) {
  // inputにフォーカス中は Enter のみ各inputのinlineハンドラに任せ、他は無視
  // e.target でイベント発生元を判定（blur()後にactiveElementが変わっても正しく判定できる）
  const tag = e.target && e.target.tagName;
  const inInput = (tag === 'INPUT' || tag === 'TEXTAREA');

  const key = e.key;
  const sec = state.section;

  // ── 学習モード ──
  if (sec === 'study') {
    // 範囲入力欄などにフォーカスがあるときは、矢印キーでカーソルを動かせるよう何もしない
    if (inInput) return;
    if (key === 'ArrowRight' || key === ' ' || key === 'Enter') {
      e.preventDefault();
      studyAdvance();
    } else if (key === 'ArrowLeft') {
      e.preventDefault();
      studyPrev();
    } else if ((key === 'm' || key === 'M' || key === 'ArrowUp') && !e.repeat) {     // マーク：M または ↑
      e.preventDefault();
      const w = getRange(state.studyStart, state.studyEnd)[state.studyIdx];
      if (w) toggleMark(w.no);
    }
    return;
  }

  // ── テスト・タイピング・復習：マークのキー ──
  // 4択では M または ↑。タイピングの入力中は、M は文字として入力されるので、↑ だけをマークに使う
  if (QUIZ_SECTIONS.includes(sec) && !e.repeat && (key === 'ArrowUp' || ((key === 'm' || key === 'M') && !inInput && !e.ctrlKey && !e.metaKey && !e.altKey))) {
    if (markCurrentQuizWord()) { e.preventDefault(); return; }
  }

  // ── テストモード ──
  if (sec === 'test') {
    if (!inInput && (key === ' ' || key === 'Enter')) {
      e.preventDefault();
      if (state.testAnswered) {
        // 回答後 → 次へ
        nextTest();
      }
      return;
    }
    // 1-4 で選択肢を選ぶ（回答前のみ）
    // ※入力欄(範囲指定の数字入力)にフォーカスがあるときは 1〜4 を横取りしない
    if (!inInput && !state.testAnswered && ['1','2','3','4'].includes(key)) {
      e.preventDefault();
      const btns = document.querySelectorAll('#choices .choice-btn:not(:disabled)');
      const idx = parseInt(key) - 1;
      if (btns[idx]) btns[idx].click();
    }
    return;
  }

  // ── タイピングモード ──
  if (sec === 'typing') {
    if (key === 'Enter' && inInput) return; // inline handleに任せる
    if (!inInput && (key === ' ' || key === 'Enter')) {
      e.preventDefault();
      if (state.typingAnswered) {
        nextTyping();
      }
    }
    return;
  }

  // ── 復習モード ──
  if (sec === 'review') {
    if (state.reviewMode === 'test') {
      if (!inInput && (key === ' ' || key === 'Enter')) {
        e.preventDefault();
        if (state.reviewAnswered) nextReviewTest();
        return;
      }
      if (!inInput && !state.reviewAnswered && ['1','2','3','4'].includes(key)) {
        e.preventDefault();
        const btns = document.querySelectorAll('#section-review .choice-btn:not(:disabled)');
        const idx = parseInt(key) - 1;
        if (btns[idx]) btns[idx].click();
      }
    } else {
      // タイピング
      if (key === 'Enter' && inInput) return;
      if (!inInput && (key === ' ' || key === 'Enter')) {
        e.preventDefault();
        if (state.reviewAnswered) nextReviewTyping();
      }
    }
    return;
  }
});

// ── 下部ナビの実寸を測って CSS変数 --nav-h に反映 ──
// #nav は padding に safe-area-inset-bottom を含むため、その分を差し引いた値を入れる
// （CSS側で bottom / padding に env(safe-area-inset-bottom) を別途加算しているため）。
function syncNavHeight() {
  const nav = document.getElementById('nav');
  if (!nav) return;
  if (getComputedStyle(nav).position !== 'fixed') {
    // デスクトップ（ナビが上部）では不要
    document.documentElement.style.removeProperty('--nav-h');
    document.documentElement.style.removeProperty('--top-h');
    return;
  }
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom,0px);visibility:hidden;pointer-events:none;';
  document.body.appendChild(probe);
  const safe = probe.getBoundingClientRect().height || 0;
  document.body.removeChild(probe);
  const h = Math.max(0, Math.round(nav.getBoundingClientRect().height - safe));
  if (h > 0) document.documentElement.style.setProperty('--nav-h', h + 'px');
  const top = document.getElementById('topbar');
  if (top) {
    const th = Math.round(top.getBoundingClientRect().height);
    if (th > 0) document.documentElement.style.setProperty('--top-h', th + 'px');
  }
}
window.addEventListener('resize', syncNavHeight);
window.addEventListener('orientationchange', syncNavHeight);

// ── INIT ──
document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
loadStorage();
initSync();
showSection('study');
syncNavHeight();
// フォント読み込み後などでナビの高さが変わる場合に備えて、描画確定後にもう一度測る
window.addEventListener('load', syncNavHeight);
setTimeout(syncNavHeight, 300);
</script>
